<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Bolani Watches</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        body {
            background-color: #f6f5f2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #3e4656;
        }

        .font-heading {
            font-family: 'Cinzel', serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

    </style>

</head>


<body class="min-h-screen flex flex-col justify-between relative">

<!-- =========================================
     HEADER / NAVIGATION BAR
========================================== -->

<header class="w-full bg-[#1d2b3a] text-white sticky top-0 z-40 shadow-md">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">

        <div class="flex items-center gap-3">

            <span class="font-heading text-lg sm:text-2xl font-bold tracking-wider text-white">
                BOLANI WATCHES
            </span>

            <span class="hidden sm:inline-block bg-[#8c7a5b] text-[10px] font-bold px-2 py-0.5 rounded uppercase">
                Admin Portal
            </span>

        </div>


        <div class="flex items-center gap-4">

            <span class="text-xs font-semibold text-gray-300 hidden sm:inline">

                <i class="fa-solid fa-user-shield text-[#8c7a5b]"></i>

                Welcome, Admin

            </span>


            <button
                onclick="handleLogout()"
                class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>

    </div>

</header>



<!-- =========================================
     MAIN DASHBOARD
========================================== -->

<main class="max-w-7xl mx-auto px-3 sm:px-6 py-6 w-full flex-1">

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">


        <!-- =========================================
             LEFT COLUMN
        ========================================== -->

        <div class="lg:col-span-5 bg-white p-4 sm:p-6 rounded-2xl border border-[#999a90]/25 shadow-sm">


            <div class="border-b border-[#999a90]/20 pb-3 mb-4 flex justify-between items-center">

                <h2 class="font-heading text-lg font-bold text-[#1d2b3a]">

                    <i class="fa-solid fa-plus-circle text-[#8c7a5b]"></i>

                    Upload New Product

                </h2>


                <span class="text-[10px] font-bold bg-green-100 text-green-700 px-2 py-0.5 rounded">
                    NEW
                </span>

            </div>



            <form
                id="productUploadForm"
                onsubmit="handleProductUpload(event)"
                class="space-y-4"
            >


                <!-- =========================================
                     STEP 1: MAIN IMAGE
                ========================================== -->

                <div class="bg-[#f6f5f2] p-3 rounded-xl border border-dashed border-[#999a90]/50">

                    <label class="block text-xs font-bold text-[#1d2b3a] mb-1">

                        Step 1: Select Main Product Image *

                    </label>


                    <input
                        type="file"
                        id="mainImageInput"
                        accept="image/*"
                        onchange="previewMainImage(event)"
                        class="hidden"
                    >


                    <div
                        id="mainImageContainer"
                        class="relative w-full h-36 border-2 border-dashed border-[#999a90]/40 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-white/50 transition-all"
                        onclick="document.getElementById('mainImageInput').click()"
                    >

                        <div id="mainImagePlaceholder" class="text-center">

                            <i class="fa-solid fa-cloud-arrow-up text-2xl text-[#8c7a5b]"></i>

                            <p class="text-[11px] font-semibold text-[#6b7280] mt-1">

                                Click to Upload Main Cover Image

                            </p>

                        </div>


                        <img
                            id="mainImagePreview"
                            class="hidden absolute inset-0 w-full h-full object-contain p-1 rounded-lg"
                        >


                        <button
                            type="button"
                            id="removeMainImgBtn"
                            onclick="removeMainImage(event)"
                            class="hidden absolute top-2 right-2 bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow hover:bg-red-700 z-10"
                        >

                            <i class="fa-solid fa-xmark"></i>

                        </button>

                    </div>

                </div>



                <!-- =========================================
                     STEP 2: GALLERY IMAGES
                ========================================== -->

                <div class="bg-[#f6f5f2] p-3 rounded-xl border border-dashed border-[#999a90]/50">

                    <label class="block text-xs font-bold text-[#1d2b3a] mb-1">

                        Step 2: Multiple Gallery Images (Max 5)

                    </label>


                    <input
                        type="file"
                        id="subImagesInput"
                        accept="image/*"
                        multiple
                        onchange="previewSubImages(event)"
                        class="hidden"
                    >


                    <button
                        type="button"
                        onclick="document.getElementById('subImagesInput').click()"
                        class="w-full py-2 bg-white border border-[#999a90]/30 rounded-lg text-xs font-bold text-[#1d2b3a] hover:bg-[#1d2b3a] hover:text-white transition-colors flex items-center justify-center gap-2"
                    >

                        <i class="fa-solid fa-images"></i>

                        Add More Images

                    </button>


                    <div
                        id="subImagesContainer"
                        class="flex gap-2 mt-2 overflow-x-auto no-scrollbar py-1"
                    ></div>

                </div>



                <!-- =========================================
                     STEP 3: TITLE
                ========================================== -->

                <div>

                    <label class="block text-xs font-bold text-[#3e4656] mb-1">

                        Product Title *

                    </label>


                    <input
                        type="text"
                        id="prodTitle"
                        required
                        placeholder="e.g. Imperium Luxury Chronograph"
                        class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs text-[#1d2b3a] focus:outline-none focus:ring-2 focus:ring-[#1d2b3a]"
                    >

                </div>



                <!-- =========================================
                     DESCRIPTION
                ========================================== -->

                <div>

                    <label class="block text-xs font-bold text-[#3e4656] mb-1">

                        Description *

                    </label>


                    <textarea
                        id="prodDesc"
                        rows="2"
                        required
                        placeholder="Short product specs and details..."
                        class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs text-[#1d2b3a] focus:outline-none focus:ring-2 focus:ring-[#1d2b3a]"
                    ></textarea>

                </div>



                <!-- =========================================
                     STEP 4: CATEGORY + MATERIAL
                ========================================== -->

                <div class="grid grid-cols-2 gap-3">


                    <!-- CATEGORY -->

                    <div>

                        <label class="block text-xs font-bold text-[#3e4656] mb-1">

                            Category *

                        </label>


                        <select
                            id="prodCategory"
                            required
                            onchange="handleCategoryChange()"
                            class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs font-bold text-[#1d2b3a]"
                        >

                            <option value="men">
                                👨 Men Watches
                            </option>

                            <option value="women">
                                👩 Women Watches
                            </option>

                            <option value="couple">
                                💑 Couple Watches
                            </option>

                            <option value="kids">
                                🎈 Kids Collection
                            </option>

                        </select>

                    </div>



                    <!-- MATERIAL / CATEGORY TYPE -->

                    <div>

                        <label
                            id="materialLabel"
                            class="block text-xs font-bold text-[#3e4656] mb-1"
                        >
                            Material *
                        </label>


                        <select
                            id="prodMaterial"
                            required
                            class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs font-bold text-[#1d2b3a]"
                        >

                            <!-- JS will fill options -->

                        </select>

                    </div>

                </div>



                <!-- =========================================
                     COLORS
                ========================================== -->

                <div>

                    <label class="block text-xs font-bold text-[#3e4656] mb-1">

                        Available Colors (Comma Separated)

                    </label>


                    <input
                        type="text"
                        id="prodColors"
                        placeholder="e.g. Golden, Silver, Black Matte"
                        class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs text-[#1d2b3a]"
                    >

                </div>



                <!-- =========================================
                     STEP 5: PRICE + DELIVERY
                ========================================== -->

                <div class="grid grid-cols-2 gap-3 items-center">


                    <div>

                        <label class="block text-xs font-bold text-[#3e4656] mb-1">

                            Price (PKR) *

                        </label>


                        <input
                            type="number"
                            id="prodPrice"
                            required
                            placeholder="3500"
                            class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs font-bold text-[#1d2b3a]"
                        >

                    </div>



                    <div>

                        <label class="block text-xs font-bold text-[#3e4656] mb-1">

                            Delivery Charges

                        </label>


                        <select
                            id="deliveryOption"
                            onchange="toggleDeliveryInput()"
                            class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs font-bold text-[#1d2b3a]"
                        >

                            <option value="FREE">
                                🚚 Free Delivery
                            </option>

                            <option value="CUSTOM">
                                Custom Charges
                            </option>

                        </select>

                    </div>

                </div>



                <!-- CUSTOM DELIVERY -->

                <div id="customDeliveryContainer" class="hidden">

                    <label class="block text-xs font-bold text-[#3e4656] mb-1">

                        Delivery Amount (PKR)

                    </label>


                    <input
                        type="number"
                        id="deliveryAmount"
                        placeholder="250"
                        class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs text-[#1d2b3a]"
                    >

                </div>



                <!-- =========================================
                     SUBMIT BUTTON
                ========================================== -->

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-[#1d2b3a] hover:bg-[#8c7a5b] text-white py-3 rounded-xl font-bold text-xs sm:text-sm transition-colors shadow-md flex items-center justify-center gap-2"
                >

                    <i class="fa-solid fa-cloud-arrow-up"></i>

                    <span id="submitBtnText">
                        Publish Product
                    </span>

                </button>


            </form>

        </div>



        <!-- =========================================
             RIGHT COLUMN
        ========================================== -->

        <div class="lg:col-span-7 space-y-4">


            <!-- CATEGORY FILTERS -->

            <div class="bg-white p-3 rounded-2xl border border-[#999a90]/25 shadow-sm flex items-center gap-2 overflow-x-auto no-scrollbar">


                <button
                    onclick="filterCategory('ALL')"
                    class="cat-filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-[#1d2b3a] text-white flex items-center gap-1.5 flex-shrink-0"
                >

                    <span>All</span>

                    <span
                        id="countAll"
                        class="bg-white/20 text-white text-[10px] px-1.5 py-0.5 rounded-full"
                    >
                        0
                    </span>

                </button>



                <button
                    onclick="filterCategory('men')"
                    class="cat-filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-[#f6f5f2] text-[#1d2b3a] hover:bg-[#1d2b3a] hover:text-white transition-colors flex items-center gap-1.5 flex-shrink-0"
                >

                    <span>👨 Men</span>

                    <span
                        id="countMen"
                        class="bg-gray-200 text-gray-800 text-[10px] px-1.5 py-0.5 rounded-full"
                    >
                        0
                    </span>

                </button>



                <button
                    onclick="filterCategory('women')"
                    class="cat-filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-[#f6f5f2] text-[#1d2b3a] hover:bg-[#1d2b3a] hover:text-white transition-colors flex items-center gap-1.5 flex-shrink-0"
                >

                    <span>👩 Women</span>

                    <span
                        id="countWomen"
                        class="bg-gray-200 text-gray-800 text-[10px] px-1.5 py-0.5 rounded-full"
                    >
                        0
                    </span>

                </button>



                <button
                    onclick="filterCategory('couple')"
                    class="cat-filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-[#f6f5f2] text-[#1d2b3a] hover:bg-[#1d2b3a] hover:text-white transition-colors flex items-center gap-1.5 flex-shrink-0"
                >

                    <span>💑 Couple</span>

                    <span
                        id="countCouple"
                        class="bg-gray-200 text-gray-800 text-[10px] px-1.5 py-0.5 rounded-full"
                    >
                        0
                    </span>

                </button>



                <button
                    onclick="filterCategory('kids')"
                    class="cat-filter-btn px-3 py-2 rounded-xl text-xs font-bold bg-[#f6f5f2] text-[#1d2b3a] hover:bg-[#1d2b3a] hover:text-white transition-colors flex items-center gap-1.5 flex-shrink-0"
                >

                    <span>🎈 Kids</span>

                    <span
                        id="countKids"
                        class="bg-gray-200 text-gray-800 text-[10px] px-1.5 py-0.5 rounded-full"
                    >
                        0
                    </span>

                </button>


            </div>



            <!-- =========================================
                 MATERIAL FILTER
            ========================================== -->

            <div class="bg-white px-4 py-2 rounded-xl border border-[#999a90]/20 flex items-center justify-between text-xs gap-3">


                <span class="font-bold text-[#1d2b3a] flex-shrink-0">

                    Filter Material:

                </span>


                <select
                    id="materialFilter"
                    onchange="applyFilters()"
                    class="bg-[#f6f5f2] border border-[#999a90]/30 rounded-lg px-2 py-1 font-semibold text-[#1d2b3a] max-w-[65%]"
                >

                    <option value="ALL">
                        All Materials
                    </option>

                    <option value="Stainless Steel">
                        Stainless Steel
                    </option>

                    <option value="Leather Strap">
                        Leather Strap
                    </option>

                    <option value="Silicone / Rubber">
                        Silicone / Rubber
                    </option>

                    <option value="Chain / Mesh">
                        Chain / Mesh
                    </option>

                </select>

            </div>



            <!-- =========================================
                 PRODUCTS GRID
            ========================================== -->

            <div
                id="productsDisplayGrid"
                class="grid grid-cols-2 sm:grid-cols-3 gap-3"
            ></div>


        </div>

    </div>

</main>



<!-- =========================================
     EDIT PRODUCT MODAL
========================================== -->

<div
    id="editModal"
    class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 backdrop-blur-sm"
>


    <div class="bg-white rounded-2xl w-full max-w-lg p-5 border border-[#999a90]/30 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">


        <div class="flex justify-between items-center border-b border-[#999a90]/20 pb-3">


            <h3 class="font-bold text-[#1d2b3a] text-base flex items-center gap-2">

                <i class="fa-solid fa-pen-to-square text-[#8c7a5b]"></i>

                Edit Product Details

            </h3>


            <button
                onclick="closeEditModal()"
                class="text-gray-400 hover:text-red-600 text-lg"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>



        <form
            id="editProductForm"
            onsubmit="handleUpdateProduct(event)"
            class="space-y-3"
        >


            <input
                type="hidden"
                id="editProductId"
            >



            <!-- TITLE -->

            <div>

                <label class="block text-xs font-bold text-[#3e4656] mb-1">

                    Product Title

                </label>


                <input
                    type="text"
                    id="editTitle"
                    required
                    class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs font-semibold text-[#1d2b3a]"
                >

            </div>



            <!-- PRICE + CATEGORY -->

            <div class="grid grid-cols-2 gap-3">


                <div>

                    <label class="block text-xs font-bold text-[#3e4656] mb-1">

                        Price (PKR)

                    </label>


                    <input
                        type="number"
                        id="editPrice"
                        required
                        class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs font-bold text-[#1d2b3a]"
                    >

                </div>



                <div>

                    <label class="block text-xs font-bold text-[#3e4656] mb-1">

                        Category

                    </label>


                    <select
                        id="editCategory"
                        required
                        onchange="handleEditCategoryChange()"
                        class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs font-bold text-[#1d2b3a]"
                    >

                        <option value="men">
                            👨 Men Watches
                        </option>

                        <option value="women">
                            👩 Women Watches
                        </option>

                        <option value="couple">
                            💑 Couple Watches
                        </option>

                        <option value="kids">
                            🎈 Kids Collection
                        </option>

                    </select>

                </div>

            </div>



            <!-- =========================================
                 EDIT MATERIAL
            ========================================== -->

            <div>

                <label
                    id="editMaterialLabel"
                    class="block text-xs font-bold text-[#3e4656] mb-1"
                >
                    Material
                </label>


                <select
                    id="editMaterial"
                    required
                    class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs font-bold text-[#1d2b3a]"
                ></select>

            </div>



            <!-- COLORS -->

            <div>

                <label class="block text-xs font-bold text-[#3e4656] mb-1">

                    Colors (Comma Separated)

                </label>


                <input
                    type="text"
                    id="editColors"
                    class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs text-[#1d2b3a]"
                >

            </div>



            <!-- DESCRIPTION -->

            <div>

                <label class="block text-xs font-bold text-[#3e4656] mb-1">

                    Description

                </label>


                <textarea
                    id="editDesc"
                    rows="2"
                    required
                    class="w-full bg-[#f6f5f2] border border-[#999a90]/30 rounded-xl px-3 py-2 text-xs text-[#1d2b3a]"
                ></textarea>

            </div>



            <!-- BUTTONS -->

            <div class="flex gap-2 pt-2">


                <button
                    type="button"
                    onclick="closeEditModal()"
                    class="w-1/2 py-2.5 bg-gray-200 text-gray-700 font-bold rounded-xl text-xs"
                >

                    Cancel

                </button>


                <button
                    type="submit"
                    id="updateBtn"
                    class="w-1/2 py-2.5 bg-[#1d2b3a] hover:bg-[#8c7a5b] text-white font-bold rounded-xl text-xs transition-colors"
                >

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>



<!-- =========================================
     FOOTER
========================================== -->

<footer class="w-full bg-[#3e4656] text-white text-center py-4 text-xs sm:text-sm mt-8">

    <p>

        Web Created By

        <span class="font-bold text-[#f6f5f2]">
            @Amin Bolani
        </span>

    </p>

<!-- =========================================
     JAVASCRIPT
========================================== -->

<script>


/* =========================================
   GLOBAL VARIABLES
========================================== */

let mainFile = null;

let subFiles = [];

let allProducts = [];

let currentCatFilter = 'ALL';



/* =========================================
   CATEGORY MATERIAL OPTIONS
========================================== */

const materialOptions = {

    men: [
        {
            value: 'Stainless Steel',
            label: 'Stainless Steel'
        },
        {
            value: 'Leather Strap',
            label: 'Leather Strap'
        },
        {
            value: 'Silicone / Rubber',
            label: 'Silicone / Rubber'
        },
        {
            value: 'Chain / Mesh',
            label: 'Chain / Mesh'
        }
    ],


    women: [
        {
            value: 'Stainless Steel',
            label: 'Stainless Steel'
        },
        {
            value: 'Leather Strap',
            label: 'Leather Strap'
        },
        {
            value: 'Silicone / Rubber',
            label: 'Silicone / Rubber'
        },
        {
            value: 'Chain / Mesh',
            label: 'Chain / Mesh'
        }
    ],


    couple: [
        {
            value: 'Luxury',
            label: '💎 Luxury'
        },
        {
            value: 'Casual',
            label: '✨ Casual'
        },
        {
            value: 'Gift Sets',
            label: '🎁 Gift Sets'
        }
    ],


    kids: [
        {
            value: 'Cartoon',
            label: '🦸 Cartoon'
        },
        {
            value: 'Digital',
            label: '⚡ Digital'
        },
        {
            value: 'Colorful',
            label: '🎨 Colorful'
        },
        {
            value: 'Sports',
            label: '⚽ Sports'
        }
    ]

};



/* =========================================
   UPDATE MATERIAL DROPDOWN
========================================== */

function updateMaterialOptions(
    category,
    selectedValue = ''
) {

    const materialSelect =
        document.getElementById('prodMaterial');

    const materialLabel =
        document.getElementById('materialLabel');


    const options =
        materialOptions[category] || materialOptions.men;


    materialSelect.innerHTML = '';


    options.forEach(option => {

        const optionElement =
            document.createElement('option');

        optionElement.value =
            option.value;

        optionElement.textContent =
            option.label;

        if (
            selectedValue &&
            selectedValue === option.value
        ) {

            optionElement.selected = true;

        }

        materialSelect.appendChild(optionElement);

    });


    if (
        category === 'couple' ||
        category === 'kids'
    ) {

        materialLabel.innerText =
            category === 'couple'
                ? 'Couple Category *'
                : 'Kids Category *';

    }

    else {

        materialLabel.innerText =
            'Material *';

    }

}



/* =========================================
   EDIT MATERIAL DROPDOWN
========================================== */

function updateEditMaterialOptions(
    category,
    selectedValue = ''
) {

    const materialSelect =
        document.getElementById('editMaterial');

    const materialLabel =
        document.getElementById('editMaterialLabel');


    const options =
        materialOptions[category] || materialOptions.men;


    materialSelect.innerHTML = '';


    options.forEach(option => {

        const optionElement =
            document.createElement('option');

        optionElement.value =
            option.value;

        optionElement.textContent =
            option.label;

        if (
            selectedValue &&
            selectedValue === option.value
        ) {

            optionElement.selected = true;

        }

        materialSelect.appendChild(optionElement);

    });


    if (category === 'couple') {

        materialLabel.innerText =
            'Couple Category';

    }

/* =========================================

function previewSubImages(event) {

        );

                    thumb.innerHTML = `

                        >

                    `;


                    container.appendChild(
                        thumb
                    );

                }
            );

        }
    );

}



/* =========================================
   IMAGE COMPRESSION
========================================== */

function compressImage(
    file,
    maxWidth,
    quality,
    callback
) {

    const reader =
        new FileReader();


    reader.readAsDataURL(file);


    reader.onload =
        (e) => {

            const img =
                new Image();


            img.src =
                e.target.result;


            img.onload =
                () => {

                    const canvas =
                        document.createElement(
                            'canvas'
                        );


                    let width =
                        img.width;

                    let height =
                        img.height;


                    if (width > maxWidth) {

                        height =
                            Math.round(
                                (height * maxWidth) /
                                width
                            );

                        width =
                            maxWidth;

                    }


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            '2d'
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    canvas.toBlob(
                        (blob) => callback(blob),
                        'image/jpeg',
                        quality
                    );

                };

        };

}

/* =========================================
   PRODUCT UPLOAD
========================================== */

async function handleProductUpload(e) {

    e.preventDefault();


    if (!mainFile) {

        alert(
            "Please select a main product image!"
        );

        return;

    }


    const btnText =
        document.getElementById(
            'submitBtnText'
        );


    btnText.innerText =
        "Publishing...";


    const category =
        document.getElementById(
            'prodCategory'
        ).value;


    const material =
        document.getElementById(
            'prodMaterial'
        ).value;


    const formData =
        new FormData();



    /* MAIN IMAGE */

    formData.append(
        'mainImage',
        mainFile,
        'main.jpg'
    );



    /* SUB IMAGES */

    subFiles.forEach(
        (file, idx) => {

            formData.append(
                'subImages',
                file,
                `sub_${idx}.jpg`
            );

        }
    );



    /* PRODUCT DATA */

    formData.append(
        'title',
        document.getElementById(
            'prodTitle'
        ).value
    );


    formData.append(
        'description',
        document.getElementById(
            'prodDesc'
        ).value
    );


    formData.append(
        'category',
        category
    );


    formData.append(
        'material',
        material
    );


    formData.append(
        'colors',
        document.getElementById(
            'prodColors'
        ).value
    );


    formData.append(
        'price',
        document.getElementById(
            'prodPrice'
        ).value
    );



    /* DELIVERY */

    formData.append(
        'deliveryOption',
        document.getElementById(
            'deliveryOption'
        ).value
    );


    formData.append(
        'deliveryAmount',
        document.getElementById(
            'deliveryAmount'
        ).value
    );



    try {

        const res =
            await fetch(
                'https://watches-backend-cyan.vercel.app/api/admin/products',
                {
                    method: 'POST',

                    headers: {
                        'Authorization':
                            `Bearer ${adminToken}`
                    },

                    body: formData
                }
            );


        if (res.ok) {

            alert(
                "Product Published!"
            );


            resetForm();


            fetchProducts();

        }

        else {

            throw new Error(
                "Upload failed"
            );

        }

    }


    catch (err) {

        console.log(
            "Mock Add Executed"
        );


        const colorsArray =
            document
                .getElementById(
                    'prodColors'
                )
                .value
                .split(',')
                .map(
                    c => c.trim()
                )
                .filter(Boolean);


        const mockProduct = {

            _id:
                Date.now().toString(),

            title:
                document.getElementById(
                    'prodTitle'
                ).value,

            description:
                document.getElementById(
                    'prodDesc'
                ).value,

            category:
                category,

            material:
                material,

            colors:
                colorsArray,

            price:
                parseInt(
                    document.getElementById(
                        'prodPrice'
                    ).value
                ),

            images: [
                URL.createObjectURL(
                    mainFile
                )
            ]

        };


        allProducts.push(
            mockProduct
        );


        resetForm();


        updateCountsAndGrid();

    }


    finally {

        btnText.innerText =
            "Publish Product";

    }

}

/* =========================================
   CATEGORY FILTER
========================================== */

function filterCategory(cat) {

    currentCatFilter =
        cat;


    /*
     * Category change ke sath
     * material filter reset
     */

    const materialFilter =
        document.getElementById(
            'materialFilter'
        );


    materialFilter.value =
        'ALL';


    updateMaterialFilterOptions(
        cat
    );


    applyFilters();

}



/* =========================================
   MATERIAL FILTER OPTIONS
========================================== */

function updateMaterialFilterOptions(
    category
) {

    const select =
        document.getElementById(
            'materialFilter'
        );


    select.innerHTML = '';


    const allOption =
        document.createElement(
            'option'
        );


    allOption.value =
        'ALL';

    allOption.textContent =
        'All Materials';


    select.appendChild(
        allOption
    );


    if (
        category === 'ALL'
    ) {

        return;

    }


    const options =
        materialOptions[category];


    if (!options) return;


    options.forEach(
        option => {

            const optionElement =
                document.createElement(
                    'option'
                );


            optionElement.value =
                option.value;


            optionElement.textContent =
                option.label;


            select.appendChild(
                optionElement
            );

        }
    );

}



/* =========================================
   APPLY FILTERS
========================================== */

function applyFilters() {

    let filtered =
        [...allProducts];


    if (
        currentCatFilter !== 'ALL'
    ) {

        filtered =
            filtered.filter(
                p =>
                    p.category ===
                    currentCatFilter
            );

    }


    const matFilter =
        document.getElementById(
            'materialFilter'
        ).value;


    if (
        matFilter !== 'ALL'
    ) {

        filtered =
            filtered.filter(
                p =>
                    p.material ===
                    matFilter
            );

    }


    renderProductsGrid(
        filtered
    );

}



/* =========================================
   COUNTERS
========================================== */

function updateCountsAndGrid() {

    document.getElementById(
        'countAll'
    ).innerText =
        allProducts.length;


    document.getElementById(
        'countMen'
    ).innerText =
        allProducts.filter(
            p =>
                p.category === 'men'
        ).length;


    document.getElementById(
        'countWomen'
    ).innerText =
        allProducts.filter(
            p =>
                p.category === 'women'
        ).length;


    document.getElementById(
        'countCouple'
    ).innerText =
        allProducts.filter(
            p =>
                p.category === 'couple'
        ).length;


    document.getElementById(
        'countKids'
    ).innerText =
        allProducts.filter(
            p =>
                p.category === 'kids'
        ).length;


    applyFilters();

}



/* =========================================
   PRODUCTS GRID
========================================== */

function renderProductsGrid(
    products
) {

    const grid =
        document.getElementById(
            'productsDisplayGrid'
        );


    if (
        products.length === 0
    ) {

        grid.innerHTML = `

            <div class="col-span-3 text-center py-8 text-xs font-semibold text-[#6b7280]">

                No products found in this category.

            </div>

        `;


        return;

    }


    grid.innerHTML =
        products.map(
            p => `

                <div
                    class="bg-white rounded-xl border border-[#999a90]/25 overflow-hidden shadow-sm p-2 flex flex-col justify-between"
                >

                    <div
                        class="w-full h-28 bg-[#f6f5f2] rounded-lg overflow-hidden flex items-center justify-center"
                    >

                        <img
                            src="${p.images[0]}"
                            class="w-full h-full object-contain"
                        >

                    </div>


                    <div class="mt-2">

                        <span
                            class="text-[9px] uppercase font-bold text-[#8c7a5b] block"
                        >
                            ${p.category}
                        </span>


                        <span
                            class="text-[8px] font-bold text-[#6b7280] block"
                        >
                            ${p.material || ''}
                        </span>


                        <h4
                            class="text-xs font-bold text-[#1d2b3a] line-clamp-1"
                        >
                            ${p.title}
                        </h4>


                        <span
                            class="text-xs font-extrabold text-[#1d2b3a] block mt-0.5"
                        >
                            Rs. ${Number(p.price || 0).toLocaleString()}
                        </span>

                    </div>



                    <!-- ACTION BUTTONS -->

                    <div
                        class="mt-2 flex gap-1 pt-2 border-t border-[#999a90]/20"
                    >


                        <button
                            onclick="openEditModal('${p._id}')"
                            class="w-1/2 bg-blue-100 hover:bg-blue-600 hover:text-white text-blue-700 py-1 rounded text-[10px] font-bold transition-colors flex items-center justify-center gap-1"
                        >

                            <i class="fa-solid fa-pen-to-square"></i>

                            Edit

                        </button>


                        <button
                            onclick="deleteProduct('${p._id}')"
                            class="w-1/2 bg-red-100 hover:bg-red-600 hover:text-white text-red-700 py-1 rounded text-[10px] font-bold transition-colors flex items-center justify-center gap-1"
                        >

                            <i class="fa-solid fa-trash"></i>

                            Delete

                        </button>


                    </div>

                </div>

            `
        ).join('');

}



/* =========================================
   OPEN EDIT MODAL
========================================== */

function openEditModal(id) {

    const prod =
        allProducts.find(
            p =>
                String(p._id) ===
                String(id)
        );


    if (!prod) return;


    document.getElementById(
        'editProductId'
    ).value =
        prod._id;


    document.getElementById(
        'editTitle'
    ).value =
        prod.title || '';


    document.getElementById(
        'editPrice'
    ).value =
        prod.price || '';


    document.getElementById(
        'editCategory'
    ).value =
        prod.category || 'men';


    document.getElementById(
        'editColors'
    ).value =
        (prod.colors || []).join(', ');


    document.getElementById(
        'editDesc'
    ).value =
        prod.description || '';


    handleEditCategoryChange(
        prod.material || ''
    );


    document.getElementById(
        'editModal'
    ).classList.remove(
        'hidden'
    );

}



/* =========================================
   CLOSE EDIT MODAL
========================================== */

function closeEditModal() {

    document.getElementById(
        'editModal'
    ).classList.add(
        'hidden'
    );

}



/* =========================================
   UPDATE PRODUCT
========================================== */

async function handleUpdateProduct(e) {

    e.preventDefault();


    const id =
        document.getElementById(
            'editProductId'
        ).value;


    const category =
        document.getElementById(
            'editCategory'
        ).value;


    const material =
        document.getElementById(
            'editMaterial'
        ).value;


    const updatedData = {

        title:
            document.getElementById(
                'editTitle'
            ).value,

        price:
            parseInt(
                document.getElementById(
                    'editPrice'
                ).value
            ),

        category:
            category,

        material:
            material,

        colors:
            document
                .getElementById(
                    'editColors'
                )
                .value
                .split(',')
                .map(
                    c => c.trim()
                )
                .filter(Boolean),

        description:
            document.getElementById(
                'editDesc'
            ).value

    };


    try {

        const res =
            await fetch(
                `https://watches-backend-cyan.vercel.app/api/admin/products/${id}`,
                {
                    method: 'PUT',

                    headers: {

                        'Content-Type':
                            'application/json',

                        'Authorization':
                            `Bearer ${adminToken}`

                    },

                    body:
                        JSON.stringify(
                            updatedData
                        )

                }
            );


        if (res.ok) {

            alert(
                "Product Updated Successfully!"
            );

        }

        else {

            throw new Error(
                "Update failed"
            );

        }

    }


    catch (err) {

        console.log(
            "Mock Update Executed"
        );

    }


    const index =
        allProducts.findIndex(
            p =>
                String(p._id) ===
                String(id)
        );


    if (index !== -1) {

        allProducts[index] = {

            ...allProducts[index],

            ...updatedData

        };

    }


    closeEditModal();


    updateCountsAndGrid();

}



/* =========================================
   DELETE PRODUCT
========================================== */

async function deleteProduct(id) {

    if (
        !confirm(
            "Are you sure you want to delete this watch?"
        )
    ) {

        return;

    }


    try {

        const res =
            await fetch(
                `https://watches-backend-cyan.vercel.app/api/admin/products/${id}`,
                {
                    method: 'DELETE',

                    headers: {
                        'Authorization':
                            `Bearer ${adminToken}`
                    }

                }
            );


        if (!res.ok) {

            throw new Error(
                "Delete failed"
            );

        }

    }


    catch (err) {

        console.log(
            "Mock Delete Executed"
        );

    }


    allProducts =
        allProducts.filter(
            p =>
                String(p._id) !==
                String(id)
        );


    updateCountsAndGrid();

}



/* =========================================
   LOGOUT
========================================== */

function handleLogout() {

    localStorage.removeItem(
        'adminToken'
    );


    window.location.href =
        'lng-login.html';

}



/* =========================================

document.addEventListener(
