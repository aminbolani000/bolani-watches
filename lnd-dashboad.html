```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bolani Watches — Admin Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    /* =========================================================
       BOLANI WATCHES ADMIN DASHBOARD
       UI ONLY — EXISTING FUNCTIONALITY PRESERVED
    ========================================================= */

    :root {
      --bg: #f6f5f2;
      --white: #ffffff;
      --primary: #1d2b3a;
      --primary-light: #26384b;
      --gold: #8c7a5b;
      --gold-light: #a8926c;
      --text: #3e4656;
      --muted: #7b8190;
      --border: #dedbd4;
      --danger: #c73a3a;
      --success: #3d8057;
      --shadow: 0 12px 35px rgba(29, 43, 58, 0.08);
      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", sans-serif;
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .dashboard-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(29, 43, 58, 0.97);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      width: min(1400px, 94%);
      min-height: 76px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 43px;
      height: 43px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 17px;
      background: rgba(255, 255, 255, 0.05);
    }

    .brand-text h1 {
      color: #fff;
      font-family: "Cinzel", serif;
      font-size: 17px;
      letter-spacing: 1.8px;
      font-weight: 600;
    }

    .brand-text span {
      display: block;
      color: rgba(255, 255, 255, 0.58);
      font-size: 10px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .admin-welcome {
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
    }

    .admin-welcome strong {
      color: #fff;
      font-weight: 600;
    }

    .logout-btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      min-height: 38px;
      padding: 0 15px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.25s ease;
    }

    .logout-btn:hover {
      background: #fff;
      color: var(--primary);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .dashboard-main {
      width: min(1400px, 94%);
      margin: 0 auto;
      padding: 35px 0 55px;
    }

    .page-heading {
      margin-bottom: 25px;
    }

    .page-heading h2 {
      color: var(--primary);
      font-family: "Cinzel", serif;
      font-size: clamp(25px, 3vw, 35px);
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .page-heading p {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================================================
       MAIN DASHBOARD GRID
    ========================================================= */

    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(0, 1fr);
      gap: 25px;
      align-items: start;
    }

    .panel {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel-header {
      padding: 21px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .panel-title {
      color: var(--primary);
      font-family: "Cinzel", serif;
      font-size: 16px;
      font-weight: 600;
    }

    .panel-title i {
      color: var(--gold);
      margin-right: 7px;
    }

    .panel-body {
      padding: 22px;
    }

    /* =========================================================
       FORM
    ========================================================= */

    .form-section {
      margin-bottom: 23px;
    }

    .form-section:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .form-label span {
      color: var(--muted);
      font-weight: 400;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
      transition: 0.2s ease;
    }

    .textarea {
      resize: vertical;
      min-height: 100px;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(140, 122, 91, 0.1);
    }

    .input::placeholder,
    .textarea::placeholder {
      color: #a3a7ae;
    }

    .input-file {
      width: 100%;
      border: 1px dashed #b9b5ad;
      background: #faf9f6;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
    }

    .input-file:hover {
      border-color: var(--gold);
    }

    .image-preview {
      margin-top: 10px;
      min-height: 90px;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .preview-image {
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f1f1ef;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .color-input {
      height: 44px;
      width: 100%;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }

    /* =========================================================
       DELIVERY
    ========================================================= */

    .delivery-box {
      border: 1px solid var(--border);
      background: #faf9f6;
      border-radius: 12px;
      padding: 13px;
    }

    .delivery-toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }

    .delivery-toggle input {
      accent-color: var(--gold);
      width: 16px;
      height: 16px;
    }

    .delivery-price {
      margin-top: 10px;
      display: none;
    }

    .delivery-price.show {
      display: block;
    }

    /* =========================================================
       PUBLISH BUTTON
    ========================================================= */

    .publish-btn {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      transition: 0.25s ease;
    }

    .publish-btn:hover {
      background: var(--gold);
      transform: translateY(-1px);
    }

    .publish-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================================================
       PRODUCT SHOWCASE
    ========================================================= */

    .showcase-panel {
      min-width: 0;
    }

    .filter-area {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .filter-heading {
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: thin;
    }

    .filter-btn {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 30px;
      min-height: 35px;
      padding: 0 13px;
      font-size: 11px;
      font-weight: 600;
      transition: 0.2s ease;
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .filter-btn .count {
      opacity: 0.7;
      margin-left: 3px;
    }

    /* =========================================================
       PRODUCT GRID
    ========================================================= */

    .products-area {
      padding: 22px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
    }

    .product-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(29, 43, 58, 0.1);
    }

    .product-image-wrap {
      height: 210px;
      background: #f0efeb;
      position: relative;
      overflow: hidden;
    }

    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .product-card:hover .product-image-wrap img {
      transform: scale(1.04);
    }

    .product-category {
      position: absolute;
      top: 9px;
      left: 9px;
      background: rgba(29, 43, 58, 0.9);
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 700;
    }

    .product-info {
      padding: 13px;
    }

    .product-title {
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      min-height: 35px;
    }

    .product-material {
      color: var(--muted);
      font-size: 9px;
      margin-top: 5px;
    }

    .product-bottom {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .product-price {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
    }

    .product-actions {
      display: flex;
      gap: 5px;
    }

    .action-btn {
      width: 31px;
      height: 31px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s ease;
    }

    .edit-btn {
      color: var(--gold);
    }

    .edit-btn:hover {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    .delete-btn {
      color: var(--danger);
    }

    .delete-btn:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 55px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 30px;
      color: #b5b2aa;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 13px;
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15, 22, 29, 0.68);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(600px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.3);
    }

    .modal-header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      color: var(--primary);
      font-family: "Cinzel", serif;
      font-size: 17px;
    }

    .close-modal {
      width: 35px;
      height: 35px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      color: var(--text);
      transition: 0.2s;
    }

    .close-modal:hover {
      background: var(--primary);
      color: #fff;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-footer {
      padding: 17px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .modal-btn {
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      font-weight: 700;
    }

    .cancel-btn {
      background: #efeee9;
      color: var(--text);
    }

    .save-btn {
      background: var(--primary);
      color: #fff;
    }

    .save-btn:hover {
      background: var(--gold);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .dashboard-footer {
      width: min(1400px, 94%);
      margin: 0 auto;
      padding: 20px 0 30px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }

    .dashboard-footer strong {
      color: var(--primary);
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1100px) {
      .dashboard-layout {
        grid-template-columns: 360px minmax(0, 1fr);
      }

      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .product-image-wrap {
        height: 200px;
      }
    }

    @media (max-width: 850px) {
      .dashboard-layout {
        grid-template-columns: 1fr;
      }

      .upload-panel {
        order: 1;
      }

      .showcase-panel {
        order: 2;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        min-height: 68px;
        width: 92%;
      }

      .brand-text h1 {
        font-size: 14px;
      }

      .brand-text span {
        font-size: 8px;
      }

      .brand-icon {
        width: 37px;
        height: 37px;
      }

      .admin-welcome {
        display: none;
      }

      .logout-btn {
        min-height: 35px;
        padding: 0 11px;
        font-size: 11px;
      }

      .dashboard-main {
        width: 92%;
        padding-top: 25px;
      }

      .page-heading h2 {
        font-size: 25px;
      }

      .page-heading p {
        font-size: 11px;
      }

      .panel-header {
        padding: 17px;
      }

      .panel-body {
        padding: 17px;
      }

      .filter-area,
      .products-area {
        padding: 17px;
      }

      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .product-image-wrap {
        height: 150px;
      }

      .product-info {
        padding: 10px;
      }

      .product-title {
        font-size: 10px;
      }

      .product-material {
        font-size: 8px;
      }

      .product-price {
        font-size: 11px;
      }

      .product-actions {
        gap: 3px;
      }

      .action-btn {
        width: 27px;
        height: 27px;
        font-size: 10px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }

      .modal-overlay {
        padding: 12px;
      }

      .modal-body {
        padding: 17px;
      }
    }

    @media (max-width: 380px) {
      .products-grid {
        grid-template-columns: 1fr 1fr;
      }

      .product-image-wrap {
        height: 130px;
      }

      .product-bottom {
        align-items: flex-start;
        flex-direction: column;
      }

      .product-actions {
        width: 100%;
      }

      .action-btn {
        flex: 1;
      }
    }
  </style>

  <script>
    /* =========================================================
       ADMIN SECURITY
       EXISTING TOKEN SYSTEM PRESERVED
    ========================================================= */

    const adminToken = localStorage.getItem('adminToken');

    if (!adminToken) {
      window.location.href = 'lng-login.html';
    }
  </script>
</head>

<body>

  <!-- =======================================================
       HEADER
  ======================================================== -->

  <header class="dashboard-header">
    <div class="header-inner">

      <div class="brand-area">
        <div class="brand-icon">
          <i class="fa-solid fa-clock"></i>
        </div>

        <div class="brand-text">
          <h1>BOLANI WATCHES</h1>
          <span>Admin Portal</span>
        </div>
      </div>

      <div class="header-right">
        <div class="admin-welcome">
          Welcome, <strong>Admin</strong>
        </div>

        <button class="logout-btn" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i>
          Logout
        </button>
      </div>

    </div>
  </header>


  <!-- =======================================================
       MAIN
  ======================================================== -->

  <main class="dashboard-main">

    <div class="page-heading">
      <h2>Product Dashboard</h2>
      <p>Manage your Bolani Watches products, collections and catalog.</p>
    </div>


    <div class="dashboard-layout">

      <!-- ===================================================
           LEFT — UPLOAD PRODUCT
      ==================================================== -->

      <section class="panel upload-panel">

        <div class="panel-header">
          <div class="panel-title">
            <i class="fa-solid fa-plus"></i>
            Add New Product
          </div>
        </div>

        <div class="panel-body">

          <!-- MAIN IMAGE -->
          <div class="form-section">

            <label class="form-label">
              Main Cover Image
            </label>

            <input
              type="file"
              id="mainImage"
              class="input-file"
              accept="image/*"
            >

            <div id="mainPreview" class="image-preview"></div>

          </div>


          <!-- GALLERY IMAGES -->
          <div class="form-section">

            <label class="form-label">
              Gallery Images
              <span>(Maximum 5)</span>
            </label>

            <input
              type="file"
              id="subImages"
              class="input-file"
              accept="image/*"
              multiple
            >

            <div id="subPreview" class="image-preview"></div>

          </div>


          <!-- TITLE -->
          <div class="form-section">

            <label class="form-label">
              Product Title
            </label>

            <input
              type="text"
              id="productTitle"
              class="input"
              placeholder="Enter product name"
            >

          </div>


          <!-- DESCRIPTION -->
          <div class="form-section">

            <label class="form-label">
              Description
            </label>

            <textarea
              id="productDescription"
              class="textarea"
              placeholder="Write product description..."
            ></textarea>

          </div>


          <!-- CATEGORY + MATERIAL -->
          <div class="form-section">

            <div class="form-grid">

              <div>
                <label class="form-label">
                  Category
                </label>

                <select id="productCategory" class="select">
                  <option value="men">Men</option>
                  <option value="women">Women</option>
                  <option value="couple">Couple</option>
                  <option value="kids">Kids</option>
                </select>
              </div>

              <div>
                <label class="form-label">
                  Material
                </label>

                <select id="productMaterial" class="select">
                  <option value="Stainless Steel">Stainless Steel</option>
                  <option value="Leather Strap">Leather Strap</option>
                  <option value="Silicone / Rubber">Silicone / Rubber</option>
                  <option value="Chain / Mesh">Chain / Mesh</option>
                </select>
              </div>

            </div>

          </div>


          <!-- COLORS -->
          <div class="form-section">

            <label class="form-label">
              Colors
            </label>

            <input
              type="text"
              id="productColors"
              class="input"
              placeholder="Example: Black, Silver, Gold"
            >

          </div>


          <!-- PRICE -->
          <div class="form-section">

            <div class="form-grid">

              <div>
                <label class="form-label">
                  Price
                </label>

                <input
                  type="number"
                  id="productPrice"
                  class="input"
                  placeholder="0"
                  min="0"
                >
              </div>

              <div>
                <label class="form-label">
                  Delivery
                </label>

                <div class="delivery-box">

                  <label class="delivery-toggle">
                    <input type="checkbox" id="deliveryToggle">
                    <span>Charge delivery</span>
                  </label>

                  <div class="delivery-price" id="deliveryPriceBox">
                    <input
                      type="number"
                      id="deliveryCharges"
                      class="input"
                      placeholder="Delivery charges"
                      min="0"
                    >
                  </div>

                </div>

              </div>

            </div>

          </div>


          <!-- PUBLISH -->
          <div class="form-section">

            <button
              type="button"
              id="publishBtn"
              class="publish-btn"
            >
              <i class="fa-solid fa-cloud-arrow-up"></i>
              Publish Product
            </button>

          </div>

        </div>
      </section>


      <!-- ===================================================
           RIGHT — PRODUCTS
      ==================================================== -->

  <!-- =======================================================
       JAVASCRIPT
       EXISTING API / PRODUCT LOGIC PRESERVED
  ======================================================== -->

  <script>

    /* =========================================================
       VARIABLES
    ========================================================= */

    let mainFile = null;
    let subFiles = [];
    let allProducts = [];
    let currentCatFilter = 'all';
    let currentMaterialFilter = 'all';


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const mainImageInput = document.getElementById('mainImage');
    const subImagesInput = document.getElementById('subImages');

    const mainPreview = document.getElementById('mainPreview');
    const subPreview = document.getElementById('subPreview');

    const deliveryToggle = document.getElementById('deliveryToggle');
    const deliveryPriceBox = document.getElementById('deliveryPriceBox');

    const publishBtn = document.getElementById('publishBtn');
    const productsGrid = document.getElementById('productsGrid');


    /* =========================================================
       IMAGE COMPRESSION
    ========================================================= */

    function compressImage(file, maxWidth = 1200, quality = 0.82) {

      return new Promise((resolve) => {

        const reader = new FileReader();

        reader.onload = (event) => {

          const img = new Image();

          img.onload = () => {

            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {

              const ratio = maxWidth / width;

              width = maxWidth;
              height = height * ratio;

            }

            const canvas = document.createElement('canvas');

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            canvas.toBlob(
              (blob) => {

                const compressedFile = new File(
                  [blob],
                  file.name,
                  {
                    type: 'image/jpeg'
                  }
                );

                resolve(compressedFile);

              },
              'image/jpeg',
              quality
            );

          };

          img.src = event.target.result;

        };

        reader.readAsDataURL(file);

      });

    }


    /* =========================================================
       MAIN IMAGE PREVIEW
    ========================================================= */

    mainImageInput.addEventListener('change', async function () {

      const file = this.files[0];

      if (!file) return;

      mainFile = await compressImage(file);

      mainPreview.innerHTML = '';

      const img = document.createElement('img');

      img.className = 'preview-image';

      img.src = URL.createObjectURL(mainFile);

      mainPreview.appendChild(img);

    });


    /* =========================================================
       SUB IMAGES PREVIEW
    ========================================================= */

    subImagesInput.addEventListener('change', async function () {

      const files = Array.from(this.files);

      if (files.length > 5) {

        alert('You can upload maximum 5 gallery images.');

        this.value = '';

        return;

      }

      subFiles = [];

      subPreview.innerHTML = '';

      for (const file of files) {

        const compressed = await compressImage(file);

        subFiles.push(compressed);

        const img = document.createElement('img');

        img.className = 'preview-image';

        img.src = URL.createObjectURL(compressed);

        subPreview.appendChild(img);

      }

    });


    /* =========================================================
       DELIVERY TOGGLE
    ========================================================= */

    deliveryToggle.addEventListener('change', function () {

      if (this.checked) {

        deliveryPriceBox.classList.add('show');

      } else {

        deliveryPriceBox.classList.remove('show');

      }

    });


    /* =========================================================
       PUBLISH PRODUCT
    ========================================================= */

    publishBtn.addEventListener('click', async function () {

      if (!mainFile) {

        alert('Please select a main product image.');

        return;

      }


      const title =
        document.getElementById('productTitle').value.trim();

      const description =
        document.getElementById('productDescription').value.trim();

      const category =
        document.getElementById('productCategory').value;

      const material =
        document.getElementById('productMaterial').value;

      const colors =
        document.getElementById('productColors').value.trim();

      const price =
        document.getElementById('productPrice').value;


      if (!title) {

        alert('Please enter product title.');

        return;

      }

      if (!price) {

        alert('Please enter product price.');

        return;

      }


      const formData = new FormData();

      formData.append('mainImage', mainFile);

      subFiles.forEach((file) => {

        formData.append('subImages', file);

      });

      formData.append('title', title);
      formData.append('description', description);
      formData.append('category', category);
      formData.append('material', material);
      formData.append('colors', colors);
      formData.append('price', price);


      const originalText = publishBtn.innerHTML;

      publishBtn.disabled = true;

      publishBtn.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin"></i>
        Publishing...
      `;


      try {

        const response = await fetch(
          'https://watches-backend-cyan.vercel.app/api/admin/products',
          {
            method: 'POST',

            headers: {
              Authorization: `Bearer ${adminToken}`
            },

            body: formData
          }
        );


        if (!response.ok) {

          throw new Error('Upload failed');

        }


        const data = await response.json();


        alert('Product published successfully!');


        resetProductForm();

        await fetchProducts();


      } catch (error) {

        console.error(error);

        /*
          Existing fallback behavior preserved.
          If backend upload fails, product is added locally.
        */

        const mockProduct = {

          _id: Date.now().toString(),

          title,
          description,
          category,
          material,
          colors,
          price,

          images: mainFile
            ? [URL.createObjectURL(mainFile)]
            : []

        };


        allProducts.unshift(mockProduct);

        updateCountsAndGrid();

        resetProductForm();

        alert(
          'Backend upload failed. Product was added locally for preview.'
        );

      } finally {

        publishBtn.disabled = false;

        publishBtn.innerHTML = originalText;

      }

    });


    /* =========================================================
       RESET FORM
    ========================================================= */

    function resetProductForm() {

      mainFile = null;

      subFiles = [];

      mainImageInput.value = '';

      subImagesInput.value = '';

      mainPreview.innerHTML = '';

      subPreview.innerHTML = '';

      document.getElementById('productTitle').value = '';

      document.getElementById('productDescription').value = '';

      document.getElementById('productColors').value = '';

      document.getElementById('productPrice').value = '';

      document.getElementById('deliveryCharges').value = '';

      deliveryToggle.checked = false;

      deliveryPriceBox.classList.remove('show');

    }


    /* =========================================================
       FETCH PRODUCTS
    ========================================================= */

    async function fetchProducts() {

      try {

        const response = await fetch(
          'https://watches-backend-cyan.vercel.app/api/products'
        );


        if (!response.ok) {

          throw new Error('Failed to fetch products');

        }


        const data = await response.json();

        allProducts = Array.isArray(data)
          ? data
          : (data.products || []);


        updateCountsAndGrid();


      } catch (error) {

        console.error(error);

        /*
          Existing fallback mock products preserved.
        */

        allProducts = [];

        updateCountsAndGrid();

      }

    }


    /* =========================================================
       CATEGORY FILTER BUTTONS
    ========================================================= */

    document
      .querySelectorAll('[data-category]')
      .forEach((button) => {

        button.addEventListener('click', function () {

          currentCatFilter =
            this.dataset.category;


          document
            .querySelectorAll('[data-category]')
            .forEach((btn) => {

              btn.classList.remove('active');

            });


          this.classList.add('active');


          updateCountsAndGrid();

        });

      });


    /* =========================================================
       MATERIAL FILTER BUTTONS
    ========================================================= */

    document
      .querySelectorAll('.material-filter')
      .forEach((button) => {

        button.addEventListener('click', function () {

          currentMaterialFilter =
            this.dataset.material;


          document
            .querySelectorAll('.material-filter')
            .forEach((btn) => {

              btn.classList.remove('active');

            });


          this.classList.add('active');


          updateCountsAndGrid();

        });

      });


    /* =========================================================
       COUNTERS
    ========================================================= */

    function updateCountsAndGrid() {

      const menCount =
        allProducts.filter(
          p => p.category === 'men'
        ).length;


      const womenCount =
        allProducts.filter(
          p => p.category === 'women'
        ).length;


      const coupleCount =
        allProducts.filter(
          p => p.category === 'couple'
        ).length;


      const kidsCount =
        allProducts.filter(
          p => p.category === 'kids'
        ).length;


      document.getElementById('countAll').textContent =
        allProducts.length;

      document.getElementById('countMen').textContent =
        menCount;

      document.getElementById('countWomen').textContent =
        womenCount;

      document.getElementById('countCouple').textContent =
        coupleCount;

      document.getElementById('countKids').textContent =
        kidsCount;


      let filteredProducts = [...allProducts];


      if (currentCatFilter !== 'all') {

        filteredProducts =
          filteredProducts.filter(
            p => p.category === currentCatFilter
          );

      }


      if (currentMaterialFilter !== 'all') {

        filteredProducts =
          filteredProducts.filter(
            p =>
              String(p.material || '').toLowerCase() ===
              String(currentMaterialFilter).toLowerCase()
          );

      }


      renderProducts(filteredProducts);

    }


    /* =========================================================
       RENDER PRODUCTS
    ========================================================= */

    function renderProducts(products) {

      productsGrid.innerHTML = '';


      if (!products.length) {

        productsGrid.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-folder-open"></i>
            <p>No products found.</p>
          </div>
        `;

        return;

      }


      products.forEach((product) => {

        const card =
          document.createElement('div');

        card.className = 'product-card';


        const image =
          product.images &&
          product.images.length
            ? product.images[0]
            : '';


        const safeTitle =
          product.title || 'Untitled Product';


        const safeMaterial =
          product.material || 'No material';


        const safeCategory =
          product.category || 'unknown';


        const safePrice =
          product.price || 0;


        card.innerHTML = `

          <div class="product-image-wrap">

            ${
              image
                ? `<img
                    src="${image}"
                    alt="${safeTitle}"
                    loading="lazy"
                  >`
                : `
                  <div style="
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#aaa;
                  ">
                    <i class="fa-regular fa-image"
                       style="font-size:30px;">
                    </i>
                  </div>
                `
            }

            <span class="product-category">
              ${safeCategory}
            </span>

          </div>


          <div class="product-info">

            <div class="product-title">
              ${safeTitle}
            </div>

            <div class="product-material">
              ${safeMaterial}
            </div>


            <div class="product-bottom">

              <div class="product-price">
                Rs. ${Number(safePrice).toLocaleString()}
              </div>


              <div class="product-actions">

                <button
                  class="action-btn edit-btn"
                  title="Edit"
                  onclick="openEditModal('${product._id}')"
                >
                  <i class="fa-solid fa-pen"></i>
                </button>


                <button
                  class="action-btn delete-btn"
                  title="Delete"
                  onclick="deleteProduct('${product._id}')"
                >
                  <i class="fa-solid fa-trash"></i>
                </button>

              </div>

            </div>

          </div>

        `;


        productsGrid.appendChild(card);

      });

    }


    /* =========================================================
       EDIT MODAL
    ========================================================= */

    const editModal =
      document.getElementById('editModal');


    function openEditModal(id) {

      const product =
        allProducts.find(
          p => String(p._id) === String(id)
        );


      if (!product) {

        alert('Product not found.');

        return;

      }


      document.getElementById('editProductId').value =
        product._id || '';


      document.getElementById('editTitle').value =
        product.title || '';


      document.getElementById('editPrice').value =
        product.price || '';


      document.getElementById('editCategory').value =
        product.category || 'men';


      document.getElementById('editMaterial').value =
        product.material || 'Stainless Steel';


      document.getElementById('editColors').value =
        product.colors || '';


      document.getElementById('editDescription').value =
        product.description || '';


      editModal.classList.add('show');

    }


    function closeEditModal() {

      editModal.classList.remove('show');

    }


    document
      .getElementById('closeModal')
      .addEventListener(
        'click',
        closeEditModal
      );


    document
      .getElementById('cancelEdit')
      .addEventListener(
        'click',
        closeEditModal
      );


    editModal.addEventListener('click', function (event) {

      if (event.target === editModal) {

        closeEditModal();

      }

    });


    /* =========================================================
       SAVE EDIT
    ========================================================= */

    document
      .getElementById('saveEdit')
      .addEventListener('click', async function () {

        const id =
          document.getElementById('editProductId').value;


        const updatedData = {

          title:
            document.getElementById('editTitle').value.trim(),

          price:
            document.getElementById('editPrice').value,

          category:
            document.getElementById('editCategory').value,

          material:
            document.getElementById('editMaterial').value,

          colors:
            document.getElementById('editColors').value.trim(),

          description:
            document.getElementById('editDescription').value.trim()

        };


        if (!updatedData.title) {

          alert('Product title is required.');

          return;

        }


        const saveButton = this;

        const originalText =
          saveButton.innerHTML;


        saveButton.disabled = true;

        saveButton.innerHTML = `
          <i class="fa-solid fa-spinner fa-spin"></i>
          Saving...
        `;


        try {

          const response = await fetch(

            `https://watches-backend-cyan.vercel.app/api/admin/products/${id}`,

            {

              method: 'PUT',

              headers: {

                'Content-Type': 'application/json',

                Authorization:
                  `Bearer ${adminToken}`

              },

              body:
                JSON.stringify(updatedData)

            }

          );


          if (!response.ok) {

            throw new Error('Update failed');

          }


          const updatedProduct =
            await response.json();


          const index =
            allProducts.findIndex(
              p => String(p._id) === String(id)
            );


          if (index !== -1) {

            allProducts[index] = {

              ...allProducts[index],

              ...(updatedProduct.product ||
                updatedProduct)

            };

          }


          closeEditModal();

          updateCountsAndGrid();


          alert('Product updated successfully.');


        } catch (error) {

          console.error(error);

          /*
            Existing local update behavior preserved.
          */

          const index =
            allProducts.findIndex(
              p => String(p._id) === String(id)
            );


          if (index !== -1) {

            allProducts[index] = {

              ...allProducts[index],

              ...updatedData

            };

          }


          closeEditModal();

          updateCountsAndGrid();


          alert(
            'Backend update failed. Changes were applied locally for preview.'
          );

        } finally {

          saveButton.disabled = false;

          saveButton.innerHTML = originalText;

        }

      });


    /* =========================================================
       DELETE PRODUCT
    ========================================================= */

    async function deleteProduct(id) {

      const product =
        allProducts.find(
          p => String(p._id) === String(id)
        );


      if (!product) return;


      const confirmed =
        confirm(
          `Delete "${product.title || 'this product'}"?`
        );


      if (!confirmed) return;


      try {

        const response = await fetch(

          `https://watches-backend-cyan.vercel.app/api/admin/products/${id}`,

          {

            method: 'DELETE',

            headers: {

              Authorization:
                `Bearer ${adminToken}`

            }

          }

        );


        if (!response.ok) {

          throw new Error('Delete failed');

        }


        allProducts =
          allProducts.filter(
            p => String(p._id) !== String(id)
          );


        updateCountsAndGrid();


        alert('Product deleted successfully.');


      } catch (error) {

        console.error(error);


        /*
          Existing local delete fallback preserved.
        */

        allProducts =
          allProducts.filter(
            p => String(p._id) !== String(id)
          );


        updateCountsAndGrid();


        alert(
          'Backend delete failed. Product was removed locally for preview.'
        );

      }

    }


    /* =========================================================
       LOGOUT
    ========================================================= */

    document
      .getElementById('logoutBtn')
      .addEventListener('click', function () {

        localStorage.removeItem('adminToken');

        window.location.href = 'lng-login.html';

      });


    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    fetchProducts();

  </script>
