<script>

/* =====================================================
   WOMEN COLLECTION JAVASCRIPT
   =====================================================

   DATABASE CATEGORY:
   women

   DATABASE MATERIAL VALUES:
   Stainless Steel
   Leather Strap
   Silicone / Rubber
   Chain / Mesh

   IMPORTANT:
   UI buttons ke names alag hain:
   METAL
   LEATHER
   SILICONE
   MESH

   Is script mein UI ko database material se properly
   connect kiya gaya hai.
===================================================== */


/* =====================================================
   1. GLOBAL VARIABLES
===================================================== */

let allProducts = [];

let currentMaterial = 'ALL';



/* =====================================================
   2. MATERIAL MAPPING
===================================================== */

/*
   Left side:
   HTML button ka data-material

   Right side:
   Database mein actual material
*/

const materialMap = {

    ALL: 'ALL',

    METAL: 'Stainless Steel',

    LEATHER: 'Leather Strap',

    SILICONE: 'Silicone / Rubber',

    MESH: 'Chain / Mesh'

};



/* =====================================================
   3. FETCH WOMEN PRODUCTS
===================================================== */

async function fetchWomenProducts() {

    try {

        const response = await fetch(
            'https://watches-backend-cyan.vercel.app/api/products?category=women'
        );


        if (!response.ok) {

            throw new Error(
                `API Error: ${response.status}`
            );

        }


        allProducts = await response.json();


        console.log(
            'Women products loaded:',
            allProducts
        );


        /*
         * Products load hone ke baad
         * default ALL material show hoga.
         */

        applyFilters();


    } catch (error) {

        console.error(
            'Women products fetch error:',
            error
        );


        /*
         * Backend error hone par
         * fake products show nahi karenge.
         */

        allProducts = [];

        applyFilters();

    }

}



/* =====================================================
   4. MATERIAL FILTER
===================================================== */

     * Leather Strap
     */

    currentMaterial = materialType;

     */

        .querySelectorAll('.category-btn')
        .forEach(btn => {

            if (
                btn.getAttribute('data-material') ===
                materialType
            ) {

                btn.classList.add('active');

            } else {

                btn.classList.remove('active');

            }

        });



    /*
     * UPDATE ACTIVE FILTER LABEL
     */

    const activeFilterLabel =
        document.getElementById(
            'activeFilterLabel'
        );


    if (activeFilterLabel) {

        const labels = {

            ALL:
                'ALL WOMEN WATCHES',

            METAL:
                'STAINLESS STEEL WATCHES',

            LEATHER:
                'LEATHER STRAP WATCHES',

            SILICONE:
                'SILICONE / RUBBER WATCHES',

            MESH:
                'CHAIN / MESH WATCHES'

        };


        activeFilterLabel.innerText =
            labels[materialType] ||
            'ALL WOMEN WATCHES';

    }


    /*
     * APPLY FILTER
     */

    applyFilters();

}



/* =====================================================
   5. APPLY FILTERS
===================================================== */

function applyFilters() {

    /*
     * Start with all women products
     */

    let filtered = [
        ...allProducts
    ];



    /* =================================================
       MATERIAL FILTER
    ================================================== */

    if (currentMaterial !== 'ALL') {


        /*
         * UI material ko database material mein convert
         */

        const databaseMaterial =
            materialMap[currentMaterial];


        console.log(
            'Selected UI Material:',
            currentMaterial
        );


        console.log(
            'Database Material:',
            databaseMaterial
        );


        /*
         * Database material ke against filter
         */

        filtered =
            filtered.filter(product => {


                const productMaterial =
                    String(
                        product.material || ''
                    )
                    .trim()
                    .toLowerCase();


                const requiredMaterial =
                    String(
                        databaseMaterial || ''
                    )
                    .trim()
                    .toLowerCase();


                return (
                    productMaterial ===
                    requiredMaterial
                );

            });

    }



    /* =================================================
       PRICE FILTER
    ================================================== */

    const priceSort =
        document.getElementById(
            'priceSort'
        );


    const priceVal =
        priceSort
            ? priceSort.value
            : 'ALL';



    /* =================================================
       LOW TO HIGH
    ================================================== */

    if (priceVal === 'LOW_HIGH') {

        filtered.sort(
            (a, b) =>
                Number(a.price || 0) -
                Number(b.price || 0)
        );

    }



    /* =================================================
       HIGH TO LOW
    ================================================== */

    else if (priceVal === 'HIGH_LOW') {

        filtered.sort(
            (a, b) =>
                Number(b.price || 0) -
                Number(a.price || 0)
        );

    }



    /* =================================================
       UNDER 3000
    ================================================== */

    else if (priceVal === 'UNDER_3000') {

        filtered =
            filtered.filter(product =>
                Number(product.price || 0) <= 3000
            );

    }



    /* =================================================
       3000 - 7000
    ================================================== */

    else if (priceVal === '3000_7000') {

        filtered =
            filtered.filter(product => {

                const price =
                    Number(
                        product.price || 0
                    );


                return (
                    price >= 3000 &&
                    price <= 7000
                );

            });

    }



    /* =================================================
       ABOVE 7000
    ================================================== */

    else if (priceVal === 'ABOVE_7000') {

        filtered =
            filtered.filter(product =>
                Number(product.price || 0) > 7000
            );

    }



    /* =================================================
       RENDER
    ================================================== */

    renderProducts(filtered);

}



/* =====================================================
   6. RENDER PRODUCTS
===================================================== */

function renderProducts(products) {

    const grid =
        document.getElementById(
            'productsGrid'
        );


    /*
     * Safety check
     */

    if (!grid) {

        console.error(
            'productsGrid not found in women.html'
        );

        return;

    }



    /* =================================================
       NO PRODUCTS
    ================================================== */

    if (products.length === 0) {

        grid.innerHTML = `

            <div class="empty-products">

                <i class="fa-solid fa-box-open"></i>

                <p class="empty-title">
                    Is category mein koi watch maujood nahi hai.
                </p>

                <p class="empty-subtitle">
                    Dusri category ya price filter check karein.
                </p>

            </div>

        `;

        return;

    }



    /* =================================================
       PRODUCT CARDS
    ================================================== */

    grid.innerHTML = products.map(product => {


        /*
         * PRODUCT IMAGE
         */

        const image =
            product.images &&
            product.images.length > 0

                ? product.images[0]

                : 'images/placeholder.jpg';



        /*
         * PRODUCT PRICE
         */

        const price =
            Number(
                product.price || 0
            )
            .toLocaleString();



        /*
         * PRODUCT MATERIAL
         */

        const material =
            product.material ||
            'Women Watch';



        /*
         * PRODUCT DESCRIPTION
         */

        const description =
            product.description ||
            'Premium Quality Women Watch';



        return `

            <div
                onclick="goToDetail('${product._id}')"
                class="product-card"
            >


                <!-- PRODUCT IMAGE -->

                <div class="product-image-container">


                    <img
                        src="${image}"
                        alt="${product.title || 'Women Watch'}"
                        class="product-image"
                        loading="lazy"
                    >


                    <!-- MATERIAL BADGE -->

                    <span class="material-badge">

                        ${material}

                    </span>


                </div>



                <!-- PRODUCT BODY -->

                <div class="product-body">


                    <div>

                        <h3 class="product-title">

                            ${product.title || 'Women Watch'}

                        </h3>


                        <p class="product-description">

                            ${description}

                        </p>

                    </div>



                    <!-- PRICE + DETAILS -->

                    <div class="product-bottom">


                        <span class="product-price">

                            Rs. ${price}

                        </span>


                        <button
                            type="button"
                            class="details-button"
                            onclick="event.stopPropagation(); goToDetail('${product._id}')"
                        >

                            <span>
                                Details
                            </span>

                            <i class="fa-solid fa-chevron-right"></i>

                        </button>


                    </div>


                </div>


            </div>

        `;

    }).join('');

}



/* =====================================================
   7. PRODUCT DETAIL PAGE
===================================================== */

function goToDetail(productId) {

    window.location.href =
        `product-detail.html?id=${productId}`;

}



/* =====================================================
   8. INITIAL LOAD
===================================================== */

document.addEventListener(
    'DOMContentLoaded',
    function () {

        fetchWomenProducts();

    }
);

</script>





</body>
</html>
