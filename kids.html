<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kids Watch Collection - Bolani Watches</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Google Fonts -->
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');


    /* =====================================================
       GLOBAL
    ===================================================== */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;

        background-color: #f6f5f2;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #3e4656;
    }

    button,
    select {
        font-family: inherit;
    }

    button {
        cursor: pointer;
    }


    /* =====================================================
       FONTS
    ===================================================== */

    .font-heading {
        font-family: 'Cinzel', serif;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {
        width: 100%;
        background: rgba(246, 245, 242, 0.90);
        border-bottom: 1px solid rgba(153, 154, 144, 0.20);

        position: sticky;
        top: 0;
        z-index: 50;

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    .header-inner {
        width: 100%;
        max-width: 1280px;

        margin: 0 auto;

        padding: 16px 16px;

        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo-link {
        display: flex;
        flex-direction: column;

        text-decoration: none;

        color: #1d2b3a;
    }

    .logo-title {
        font-family: 'Cinzel', serif;

        font-size: 30px;
        font-weight: 700;

        letter-spacing: 0.06em;

        color: #1d2b3a;

        transition: color 0.3s ease;
    }

    .logo-link:hover .logo-title {
        color: #8c7a5b;
    }

    .logo-subtitle {
        font-size: 10px;

        letter-spacing: 0.20em;

        text-transform: uppercase;

        color: #6b7280;
    }

    .main-site-link {
        display: flex;
        align-items: center;
        gap: 6px;

        color: #1d2b3a;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;

        transition: all 0.3s ease;
    }

    .main-site-link:hover {
        text-decoration: underline;
    }


    /* =====================================================
       FLOATING CATEGORY IMAGE ANIMATION
    ===================================================== */

    @keyframes floatEffect {

        0% {
            transform: translateY(0px) rotate(0deg);
        }

        50% {
            transform: translateY(-8px) rotate(2deg);
        }

        100% {
            transform: translateY(0px) rotate(0deg);
        }

    }

    .float-img {
        animation: floatEffect 3.5s ease-in-out infinite;
    }

    .float-delay-1 {
        animation-delay: 0.5s;
    }

    .float-delay-2 {
        animation-delay: 1s;
    }

    .float-delay-3 {
        animation-delay: 1.5s;
    }

    .float-delay-4 {
        animation-delay: 2s;
    }


    /* =====================================================
       MAIN CATEGORY SECTION
    ===================================================== */

    .category-section {
        width: 100%;
        max-width: 1280px;

        margin: 0 auto;

        padding: 24px 16px;
    }

    .section-heading {
        text-align: center;

        margin-bottom: 24px;
    }

    .section-heading h1 {
        font-family: 'Cinzel', serif;

        font-size: 36px;
        line-height: 1.25;

        font-weight: 700;

        color: #1d2b3a;
    }

    .section-heading p {
        margin-top: 4px;

        font-size: 14px;

        color: #6b7280;
    }


    /* =====================================================
       CATEGORY FILTER ROW
    ===================================================== */

    .category-filter-row {

        display: flex;

        justify-content: center;
        align-items: center;

        gap: 24px;

        overflow-x: auto;

        padding-top: 8px;
        padding-bottom: 16px;

        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .category-filter-row::-webkit-scrollbar {
        display: none;
    }


    /* =====================================================
       CATEGORY BUTTON
    ===================================================== */

    .category-btn {

        flex-shrink: 0;

        width: 120px;

        min-height: 112px;

        padding: 12px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: #ffffff;

        border: 1px solid rgba(153, 154, 144, 0.30);

        border-radius: 16px;

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);

        transition:
            box-shadow 0.3s ease,
            transform 0.3s ease,
            border-color 0.3s ease;
    }

    .category-btn:hover {
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);

        transform: translateY(-2px);
    }

    .category-btn.active {
        border-color: #1d2b3a;

        box-shadow:
            0 0 0 2px #1d2b3a,
            0 5px 15px rgba(0, 0, 0, 0.08);
    }

    .category-image-box {

        width: 64px;
        height: 64px;

        display: flex;

        align-items: center;
        justify-content: center;

        position: relative;
    }

    .category-image-box img {

        width: 100%;
        height: 100%;

        object-fit: contain;
    }

    .category-name {

        margin-top: 8px;

        font-size: 12px;

        font-weight: 700;

        text-transform: uppercase;

        color: #1d2b3a;

        text-align: center;
    }


    /* =====================================================
       PRICE FILTER
    ===================================================== */

    .filter-bar {

        margin-top: 16px;

        width: 100%;

        background: #ffffff;

        padding: 16px;

        border-radius: 12px;

        border: 1px solid rgba(153, 154, 144, 0.20);

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 16px;

        flex-wrap: wrap;
    }

    .active-filter {

        font-size: 14px;

        font-weight: 600;

        color: #1d2b3a;
    }

    .active-filter span {

        color: #8c7a5b;

        font-weight: 700;
    }

    .price-filter {

        display: flex;

        align-items: center;

        gap: 8px;
    }

    .price-filter label {

        font-size: 12px;

        font-weight: 700;

        color: #3e4656;

        white-space: nowrap;
    }

    #priceSort {

        min-width: 220px;

        padding: 7px 12px;

        background: #f6f5f2;

        border: 1px solid rgba(153, 154, 144, 0.30);

        border-radius: 8px;

        font-size: 14px;

        font-weight: 600;

        color: #1d2b3a;

        outline: none;
    }

    #priceSort:focus {

        border-color: #1d2b3a;

        box-shadow: 0 0 0 2px rgba(29, 43, 58, 0.10);
    }


    /* =====================================================
       PRODUCTS SECTION
    ===================================================== */

    .products-section {

        width: 100%;

        max-width: 1280px;

        margin: 0 auto;

        padding: 16px;

        flex: 1;
    }

    #productsGrid {

        width: 100%;

        display: grid;

        grid-template-columns: repeat(4, minmax(0, 1fr));

        gap: 20px;
    }


    /* =====================================================
       LOADING
    ===================================================== */

    .loading-box {

        grid-column: 1 / -1;

        text-align: center;

        padding: 48px 20px;
    }

    .loading-box i {

        font-size: 30px;

        color: #1d2b3a;
    }

    .loading-box p {

        margin-top: 8px;

        font-size: 14px;

        color: #6b7280;
    }


    /* =====================================================
       PRODUCT CARD
    ===================================================== */

    .product-card {

        cursor: pointer;

        background: #ffffff;

        border-radius: 16px;

        border: 1px solid rgba(153, 154, 144, 0.25);

        overflow: hidden;

        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);

        display: flex;

        flex-direction: column;

        justify-content: space-between;

        transition:
            box-shadow 0.3s ease,
            transform 0.3s ease;
    }

    .product-card:hover {

        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);

        transform: translateY(-3px);
    }


    /* =====================================================
       PRODUCT IMAGE
    ===================================================== */

    .product-image {

        position: relative;

        width: 100%;

        height: 208px;

        background: #f6f5f2;

        overflow: hidden;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 12px;
    }

    .product-image img {

        width: 100%;
        height: 100%;

        object-fit: contain;

        transition: transform 0.5s ease;
    }

    .product-card:hover .product-image img {

        transform: scale(1.10);
    }

    .product-type {

        position: absolute;

        top: 8px;
        left: 8px;

        background: #1d2b3a;

        color: #ffffff;

        font-size: 10px;

        font-weight: 700;

        padding: 3px 7px;

        border-radius: 999px;

        text-transform: uppercase;
    }


    /* =====================================================
       PRODUCT BODY
    ===================================================== */

    .product-body {

        padding: 16px;

        display: flex;

        flex-direction: column;

        justify-content: space-between;

        flex: 1;
    }

    .product-title {

        font-size: 16px;

        font-weight: 700;

        color: #1d2b3a;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;

        transition: color 0.3s ease;
    }

    .product-card:hover .product-title {

        color: #8c7a5b;
    }

    .product-description {

        margin-top: 2px;

        font-size: 12px;

        color: #6b7280;
    }

    .product-bottom {

        margin-top: 12px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 8px;
    }

    .product-price {

        font-size: 18px;

        font-weight: 700;

        color: #1d2b3a;

        white-space: nowrap;
    }

    .details-btn {

        border: none;

        background: #1d2b3a;

        color: #ffffff;

        font-size: 12px;

        font-weight: 600;

        padding: 7px 10px;

        border-radius: 8px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 5px;

        transition: background 0.3s ease;
    }

    .details-btn:hover {

        background: #8c7a5b;
    }


    /* =====================================================
       EMPTY PRODUCTS
    ===================================================== */

    .empty-products {

        grid-column: 1 / -1;

        text-align: center;

        padding: 48px 20px;

        background: #ffffff;

        border-radius: 16px;

        border: 1px solid rgba(153, 154, 144, 0.20);
    }

    .empty-products i {

        font-size: 40px;

        color: #999a90;

        margin-bottom: 8px;
    }

    .empty-products p:first-of-type {

        font-size: 14px;

        font-weight: 600;

        color: #1d2b3a;
    }

    .empty-products p:last-of-type {

        margin-top: 4px;

        font-size: 12px;

        color: #6b7280;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {

        width: 100%;

        margin-top: 32px;

        padding: 16px;

        background: #3e4656;

        color: #ffffff;

        text-align: center;

        font-size: 14px;
    }

    footer span {

        font-weight: 700;

        color: #f6f5f2;
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 900px) {

        #productsGrid {

            grid-template-columns: repeat(3, minmax(0, 1fr));

        }

        .category-filter-row {

            justify-content: flex-start;

        }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

        .header-inner {

            padding: 14px 16px;

        }

        .logo-title {

            font-size: 23px;

        }

        .logo-subtitle {

            font-size: 9px;

        }

        .main-site-link {

            font-size: 12px;

        }


        .category-section {

            padding: 20px 12px;

        }

        .section-heading {

            margin-bottom: 18px;

        }

        .section-heading h1 {

            font-size: 24px;

        }

        .section-heading p {

            font-size: 12px;

        }


        .category-filter-row {

            justify-content: flex-start;

            gap: 12px;

        }

        .category-btn {

            width: 80px;

            min-height: 92px;

            padding: 8px;

            border-radius: 16px;

        }

        .category-image-box {

            width: 48px;

            height: 48px;

        }

        .category-name {

            font-size: 10px;

            margin-top: 7px;

        }


        .filter-bar {

            padding: 12px;

            gap: 10px;

            align-items: flex-start;

        }

        .active-filter {

            width: 100%;

            font-size: 12px;

        }

        .price-filter {

            width: 100%;

        }

        .price-filter label {

            font-size: 11px;

        }

        #priceSort {

            flex: 1;

            min-width: 0;

            width: 100%;

            font-size: 12px;

        }


        .products-section {

            padding: 12px 8px;

        }

        #productsGrid {

            grid-template-columns: repeat(3, minmax(0, 1fr));

        }


        .product-card {

            border-radius: 12px;

        }

        .product-image {

            height: 112px;

            padding: 4px;

        }

        .product-type {

            top: 4px;

            left: 4px;

            font-size: 8px;

            padding: 2px 5px;

        }

        .product-body {

            padding: 6px;

        }

        .product-title {

        }

        .product-price {

        }

        .details-btn {

}



// =====================================================
// KIDS CATEGORY FILTER
// =====================================================

function filterKidsType(type) {

    currentKidsType = type;


    // -------------------------------------------------
    // UPDATE ACTIVE BUTTON
    // -------------------------------------------------

    document
        .querySelectorAll('.category-btn')
        .forEach(btn => {

            if (
                btn.getAttribute('data-kids') === type
            ) {

                btn.classList.add('active');

            }

            else {

                btn.classList.remove('active');

            }

        });


    // -------------------------------------------------
    // ACTIVE FILTER LABELS
    // -------------------------------------------------

    const labels = {

        ALL:
            'ALL KIDS',

        CARTOON:
            '🦸 CARTOON & HERO',

        DIGITAL:
            '⚡ DIGITAL & LED',

        COLORFUL:
            '🎨 COLORFUL',

        SPORTS:
            '⚽ SPORTS & SMART'

    };


    document.getElementById(
        'activeFilterLabel'
    ).innerText =
        labels[type] || type;


    applyFilters();

}



// =====================================================
// APPLY FILTERS
// =====================================================

function applyFilters() {

    let filtered = [
        ...allProducts
    ];


    // -------------------------------------------------
    // KIDS CATEGORY FILTER
    // -------------------------------------------------
    //
    // IMPORTANT:
    // Dashboard mein Kids ka:
    //
    // Cartoon
    // Digital
    // Colorful
    // Sports
    //
    // "material" field mein save ho raha hai.
    //
    // Isliye yahan product.material use hoga.
    // -------------------------------------------------

    if (currentKidsType !== 'ALL') {

        filtered =
            filtered.filter(product => {

                if (!product.material) {

                    return false;

                }


                return (
                    product.material
                        .toString()
                        .trim()
                        .toUpperCase()
                    === currentKidsType
                );

            });

    }



    // -------------------------------------------------
    // PRICE FILTER
    // -------------------------------------------------

    const priceSortElement =
        document.getElementById(
            'priceSort'
        );


    const priceVal =
        priceSortElement
            ? priceSortElement.value
            : 'ALL';



    // -------------------------------------------------
    // LOW TO HIGH
    // -------------------------------------------------

    if (priceVal === 'LOW_HIGH') {

        filtered.sort(
            (a, b) =>
                Number(a.price) -
                Number(b.price)
        );

    }



    // -------------------------------------------------
    // HIGH TO LOW
    // -------------------------------------------------

    else if (priceVal === 'HIGH_LOW') {

        filtered.sort(
            (a, b) =>
                Number(b.price) -
                Number(a.price)
        );

    }



    // -------------------------------------------------
    // UNDER 1500
    // -------------------------------------------------

    else if (priceVal === 'UNDER_1500') {

        filtered =
            filtered.filter(
                product =>
                    Number(product.price) <= 1500
            );

    }



    // -------------------------------------------------
    // 1500 - 3000
    // -------------------------------------------------

    else if (priceVal === '1500_3000') {

        filtered =
            filtered.filter(
                product =>
                    Number(product.price) >= 1500 &&
                    Number(product.price) <= 3000
            );

    }



    // -------------------------------------------------
    // ABOVE 3000
    // -------------------------------------------------

    else if (priceVal === 'ABOVE_3000') {

        filtered =
            filtered.filter(
                product =>
                    Number(product.price) > 3000
            );

    }



    // -------------------------------------------------
    // RENDER PRODUCTS
    // -------------------------------------------------

    renderProducts(filtered);

}



// =====================================================
// RENDER PRODUCTS
// =====================================================

function renderProducts(products) {

    const grid =
        document.getElementById(
            'productsGrid'
        );


    // -------------------------------------------------
    // SAFETY CHECK
    // -------------------------------------------------

    if (!grid) {

        console.error(
            'productsGrid element not found.'
        );

        return;

    }



    // -------------------------------------------------
    // NO PRODUCTS
    // -------------------------------------------------

    if (products.length === 0) {

        grid.innerHTML = `

            <div class="empty-products">

                <i class="fa-solid fa-box-open"></i>

                <p>
                    Is category mein koi kids watch nahi mili.
                </p>

                <p>
                    Dusri category ya price filter check karein.
                </p>

            </div>

        `;


        return;

    }



    // -------------------------------------------------
    // PRODUCT CARDS
    // -------------------------------------------------

    grid.innerHTML =
        products.map(product => {


            // -------------------------------------------------
            // PRODUCT IMAGE
            // -------------------------------------------------

            const image =
                product.images &&
                product.images.length > 0

                    ? product.images[0]

                    : 'images/placeholder.jpg';



            // -------------------------------------------------
            // PRODUCT PRICE
            // -------------------------------------------------

            const price =
                Number(product.price) || 0;



            // -------------------------------------------------
            // KIDS TYPE
            // -------------------------------------------------
            //
            // IMPORTANT:
            // Dashboard se Kids category type
            // "material" field mein aa raha hai.
            // -------------------------------------------------

            const kidsType =
                product.material ||
                'KIDS';



            return `

                <div
                    onclick="goToDetail('${product._id}')"
                    class="product-card"
                >


                    <!-- PRODUCT IMAGE -->

                    <div class="product-image">

                        <img
                            src="${image}"
                            alt="${product.title}"
                        >


                        <span class="product-type">

                            ${kidsType}

                        </span>

                    </div>



                    <!-- PRODUCT BODY -->

                    <div class="product-body">


                        <div>

                            <h3 class="product-title">

                                ${product.title}

                            </h3>


                            <p class="product-description">

                                Kid's Favorite Watch

                            </p>

                        </div>



                        <div class="product-bottom">


                            <span class="product-price">

                                Rs.
                                ${price.toLocaleString()}

                            </span>


                            <button
                                class="details-btn"
                            >

                                <span>
                                    Details
                                </span>

                                <i class="fa-solid fa-chevron-right"></i>

                            </button>


                        </div>


                    </div>


                </div>

            `;

        }).join('');

}



// =====================================================
// PRODUCT DETAIL PAGE
// =====================================================

function goToDetail(productId) {

    window.location.href =
        `product-detail.html?id=${productId}`;

}



// =====================================================
// INITIAL LOAD
// =====================================================

document.addEventListener(
    'DOMContentLoaded',
    fetchKidsProducts
);

</script>
