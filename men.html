<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"

    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');


        /* =====================================================
           GLOBAL RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background-color: #f6f5f2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #3e4656;
            display: flex;
            flex-direction: column;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        img {
            max-width: 100%;
            display: block;
        }

        a {
            text-decoration: none;
        }


        /* =====================================================
           CUSTOM CONTAINER
        ====================================================== */

        .site-container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }


        /* =====================================================
           HEADING FONT
        ====================================================== */

        .font-heading {
            font-family: 'Cinzel', serif;
        }


        /* =====================================================
           HEADER / NAVBAR
        ====================================================== */

        .top-header {
            width: 100%;
            background: rgba(246, 245, 242, 0.90);
            border-bottom: 1px solid rgba(153, 154, 144, 0.20);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-link {
            display: flex;
            flex-direction: column;
            color: #1d2b3a;
        }

        .logo-main {
            font-family: 'Cinzel', serif;
            font-size: 30px;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #1d2b3a;
            transition: color 0.3s ease;
        }

        .logo-link:hover .logo-main {
            color: #8c7a5b;
        }

        .logo-subtitle {
            font-size: 10px;
            letter-spacing: 0.20em;
            text-transform: uppercase;
            color: #6b7280;
            margin-top: 3px;
        }

        .main-site-link {
            color: #1d2b3a;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        .main-site-link:hover {
            text-decoration: underline;
            color: #8c7a5b;
        }


        /* =====================================================
           SECTION 1
        ====================================================== */

        .filter-section {
            width: 100%;
            padding: 24px 24px 0;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 24px;
        }

        .section-heading h1 {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            line-height: 1.25;
            font-weight: 700;
            color: #1d2b3a;
        }

        .section-heading p {
            font-size: 14px;
            color: #6b7280;
            margin-top: 5px;
        }


        /* =====================================================
           MATERIAL CATEGORY FILTER
        ====================================================== */

        .category-scroll {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            overflow-x: auto;
            padding: 8px 0 16px;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            flex-shrink: 0;
            width: 110px;
            min-height: 112px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(153, 154, 144, 0.30);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            color: #1d2b3a;
        }

        .category-btn:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);
            transform: translateY(-2px);
        }

        .category-btn.active {
            border-color: #1d2b3a;
            box-shadow:
                0 0 0 2px #1d2b3a,
                0 8px 20px rgba(29, 43, 58, 0.12);
        }

        .category-image {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .category-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .category-name {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 8px;
            color: #1d2b3a;
            white-space: nowrap;
        }


        /* =====================================================
           FLOATING WATCH ANIMATION
        ====================================================== */

        @keyframes floatEffect {

            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(2deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }

        }

        .float-img {
            animation: floatEffect 3.5s ease-in-out infinite;
        }

        .float-delay-1 {
            animation-delay: 0.5s;
        }

        .float-delay-2 {
            animation-delay: 1s;
        }

        .float-delay-3 {
            animation-delay: 1.5s;
        }

        .float-delay-4 {
            animation-delay: 2s;
        }


        /* =====================================================
           SECONDARY FILTER BOX
        ====================================================== */

        .secondary-filter {
            margin-top: 16px;
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(153, 154, 144, 0.20);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .active-filter {
            font-size: 14px;
            font-weight: 600;
            color: #1d2b3a;
        }

        .active-filter span {
            color: #8c7a5b;
            font-weight: 700;
        }

        .price-filter {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-filter label {
            font-size: 12px;
            font-weight: 700;
            color: #3e4656;
            white-space: nowrap;
        }

        .price-filter select {
            background: #f6f5f2;
            border: 1px solid rgba(153, 154, 144, 0.30);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            color: #1d2b3a;
            outline: none;
        }

        .price-filter select:focus {
            border-color: #1d2b3a;
            box-shadow: 0 0 0 2px rgba(29, 43, 58, 0.12);
        }


        /* =====================================================
           PRODUCTS MAIN
        ====================================================== */

        .products-main {
            width: 100%;
            padding: 16px 24px 0;
            flex: 1;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 20px;
        }

        .loading-box i {
            font-size: 30px;
            color: #1d2b3a;
        }

        .loading-box p {
            font-size: 14px;
            margin-top: 8px;
            color: #6b7280;
        }


        /* =====================================================
           PRODUCT CARD
        ====================================================== */

        .product-card {
            cursor: pointer;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid rgba(153, 154, 144, 0.25);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.13);
        }


        /* =====================================================
           PRODUCT IMAGE
        ====================================================== */

        .product-image-box {
            position: relative;
            width: 100%;
            height: 208px;
            background: #f6f5f2;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.10);
        }

        .material-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #1d2b3a;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 999px;
            text-transform: uppercase;
            z-index: 2;
        }


        /* =====================================================
           PRODUCT BODY
        ====================================================== */

        .product-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .product-title {
            font-size: 16px;
            line-height: 1.35;
            font-weight: 700;
            color: #1d2b3a;

            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;

            transition: color 0.3s ease;
        }

        .product-card:hover .product-title {
            color: #8c7a5b;
        }

        .product-description {
            font-size: 12px;
            color: #6b7280;
            margin-top: 3px;
        }

        .product-bottom {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: #1d2b3a;
            white-space: nowrap;
        }

        .details-btn {
            background: #1d2b3a;
            color: #ffffff;
            border: none;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.3s ease;
        }

        .details-btn:hover {
            background: #8c7a5b;
        }


        /* =====================================================
           EMPTY PRODUCTS
        ====================================================== */

        .empty-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 20px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid rgba(153, 154, 144, 0.20);
        }

        .empty-products i {
            font-size: 40px;
            color: #999a90;
            margin-bottom: 8px;
        }

        .empty-products p:first-of-type {
            font-size: 14px;
            font-weight: 600;
            color: #1d2b3a;
        }

        .empty-products p:last-of-type {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .site-footer {
            width: 100%;
            background: #3e4656;
            color: #ffffff;
            text-align: center;
            padding: 16px;
            font-size: 14px;
            margin-top: 32px;
        }

        .site-footer span {
            font-weight: 700;
            color: #f6f5f2;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 767px) {

            .header-inner {
                padding: 14px 16px;
            }

            .logo-main {
                font-size: 23px;
            }

            .logo-subtitle {
                font-size: 8px;
                letter-spacing: 0.16em;
            }

            .main-site-link {
                font-size: 11px;
            }


            .filter-section {
                padding: 20px 12px 0;
            }

            .section-heading {
                margin-bottom: 18px;
            }

            .section-heading h1 {
                font-size: 25px;
            }

            .section-heading p {
                font-size: 11px;
            }


            .category-scroll {
                justify-content: flex-start;
                gap: 10px;
                padding-left: 2px;
                padding-right: 2px;
            }

            .category-btn {
                width: 72px;
                min-height: 82px;
                padding: 8px;
                border-radius: 14px;
            }

            .category-image {
                width: 48px;
                height: 48px;
            }

            .category-name {
                font-size: 10px;
                margin-top: 5px;
            }


            .secondary-filter {
                padding: 12px;
                gap: 10px;
            }

            .active-filter {
                width: 100%;
                font-size: 11px;
            }

            .price-filter {
                width: 100%;
            }

            .price-filter label {
                font-size: 10px;
            }

            .price-filter select {
                width: 100%;
                font-size: 11px;
                padding: 7px 8px;
            }


            .products-main {
                padding: 12px 8px 0;
            }

            /*
             * IMPORTANT:
             * Mobile = exactly 3 cards per row
             */
            .products-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 8px;
            }


            .product-card {
                border-radius: 10px;
            }

            .product-image-box {
                height: 112px;
                padding: 4px;
            }

            .material-badge {
                top: 4px;
                left: 4px;
                font-size: 7px;
                padding: 3px 5px;
            }

            .product-body {
                padding: 6px;
            }

            .product-title {
                font-size: 10px;
            }

            .product-description {
                display: none;
            }

            .product-bottom {
                margin-top: 6px;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 5px;
            }

            .product-price {
                font-size: 11px;
            }

            .details-btn {
                width: 100%;
                font-size: 9px;
                padding: 5px 3px;
                border-radius: 5px;
            }

            .details-btn i {
                font-size: 7px;
            }


            .site-footer {
                font-size: 11px;
                padding: 13px 10px;
                margin-top: 24px;
            }
        }


        /* =====================================================
           VERY SMALL MOBILE
        ====================================================== */

        @media (max-width: 360px) {

            .logo-main {
                font-size: 20px;
            }

            .main-site-link {
                font-size: 10px;
            }

            .category-btn {
                width: 68px;
            }

            .products-grid {
                gap: 6px;
            }

            .product-image-box {
                height: 100px;
            }

            .product-title {
                font-size: 9px;
            }

            .product-price {
                font-size: 10px;
            }

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (min-width: 768px) and (max-width: 1100px) {

            .products-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px;
            }

            .product-image-box {
                height: 180px;
            }

        }

    </style>
</head>

                            8500,

                        images: [
                            "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500"
                        ]
                    },


                    {
                        _id: "6",

                        title:
                            "Dark Oak Leather Strap",

                        material:
                            "Leather Strap",

                        price:
                            3400,

                        images: [
                            "https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=500"
                        ]
                    }

                ];


                applyFilters();

            }

        }



        /* =====================================================
           MATERIAL FILTER
        ====================================================== */

        function filterMaterial(materialType) {


            currentMaterial =
                materialType;



            /*
             * ACTIVE BUTTON
             */

            document
                .querySelectorAll('.category-btn')
                .forEach(btn => {


                    if (
                        btn.getAttribute(
                            'data-material'
                        ) === materialType
                    ) {

                        btn.classList.add(
                            'active'
                        );

                    } else {

                        btn.classList.remove(
                            'active'
                        );

                    }

                });



            /*
             * UPDATE LABEL
             */

            document
                .getElementById(
                    'activeFilterLabel'
                )
                .innerText =
                materialType === 'ALL'
                    ? 'ALL MATERIAL'
                    : materialType + ' WATCHES';



            /*
             * APPLY FILTER
             */

            applyFilters();

        }



        /* =====================================================
           MATERIAL MATCH FUNCTION
        ====================================================== */

        function materialMatches(
            productMaterial,
            selectedMaterial
        ) {


            if (
                !productMaterial ||
                selectedMaterial === 'ALL'
            ) {

                return true;

            }


            const material =
                productMaterial
                    .toString()
                    .toLowerCase()
                    .trim();



            /*
             * METAL
             *
             * Backend:
             * Stainless Steel
             */

            if (
                selectedMaterial === 'METAL'
            ) {

                return (
                    material.includes(
                        'stainless'
                    ) ||
                    material.includes(
                        'steel'
                    )
                );

            }



            /*
             * LEATHER
             */

            if (
                selectedMaterial === 'LEATHER'
            ) {

                return material.includes(
                    'leather'
                );

            }



            /*
             * SILICONE
             */

            if (
                selectedMaterial === 'SILICONE'
            ) {

                return (
                    material.includes(
                        'silicone'
                    ) ||
                    material.includes(
                        'rubber'
                    )
                );

            }



            /*
             * MESH
             */

            if (
                selectedMaterial === 'MESH'
            ) {

                return (
                    material.includes(
                        'mesh'
                    ) ||
                    material.includes(
                        'chain'
                    )
                );

            }


            return false;

        }



        /* =====================================================
           APPLY ALL FILTERS
        ====================================================== */

        function applyFilters() {


            /*
             * COPY PRODUCTS
             */

            let filtered =
                [...allProducts];



            /*
             * MATERIAL
             */

            if (
                currentMaterial !== 'ALL'
            ) {

                filtered =
                    filtered.filter(
                        product =>
                            materialMatches(
                                product.material,
                                currentMaterial
                            )
                    );

            }



            /*
             * PRICE
             */

            const priceVal =
                document.getElementById(
                    'priceSort'
                ).value;



            /*
             * LOW TO HIGH
             */

            if (
                priceVal === 'LOW_HIGH'
            ) {

                filtered.sort(
                    (a, b) =>
                        Number(a.price) -
                        Number(b.price)
                );

            }



            /*
             * HIGH TO LOW
             */

            else if (
                priceVal === 'HIGH_LOW'
            ) {

                filtered.sort(
                    (a, b) =>
                        Number(b.price) -
                        Number(a.price)
                );

            }



            /*
             * UNDER 3000
             */

            else if (
                priceVal === 'UNDER_3000'
            ) {

                filtered =
                    filtered.filter(
                        product =>
                            Number(product.price) <= 3000
                    );

            }



            /*
             * 3000 - 7000
             */

            else if (
                priceVal === '3000_7000'
            ) {

                filtered =
                    filtered.filter(
                        product =>
                            Number(product.price) >= 3000 &&
                            Number(product.price) <= 7000
                    );

            }



            /*
             * ABOVE 7000
             */

            else if (
                priceVal === 'ABOVE_7000'
            ) {

                filtered =
                    filtered.filter(
                        product =>
                            Number(product.price) > 7000
                    );

            }



            /*
             * RENDER
             */

            renderProducts(filtered);

        }



        /* =====================================================
           ESCAPE HTML
           Security ke liye
        ====================================================== */

        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return '';
            }

            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }



        /* =====================================================
           MATERIAL DISPLAY NAME
        ====================================================== */

        function getMaterialName(material) {


            if (!material) {

                return '';

            }


            const value =
                material.toLowerCase();



            if (
                value.includes(
                    'stainless'
                ) ||
                value.includes(
                    'steel'
                )
            ) {

                return 'METAL';

            }


            if (
                value.includes(
                    'leather'
                )
            ) {

                return 'LEATHER';

            }


            if (
                value.includes(
                    'silicone'
                ) ||
                value.includes(
                    'rubber'
                )
            ) {

                return 'SILICONE';

            }


            if (
                value.includes(
                    'mesh'
                ) ||
                value.includes(
                    'chain'
                )
            ) {

                return 'MESH';

            }


            return material;

        }



        /* =====================================================
           RENDER PRODUCTS
        ====================================================== */

        function renderProducts(products) {


            const grid =
                document.getElementById(
                    'productsGrid'
                );



            /*
             * NO PRODUCTS
             */

            if (
                products.length === 0
            ) {

                grid.innerHTML = `

                    <div class="empty-products">

                        <i class="fa-solid fa-box-open"></i>

                        <p>
                            Is category mein koi watch maujood nahi ha.
                        </p>

                        <p>
                            Dusri category ya price filter check karein.
                        </p>

                    </div>

                `;

                return;

            }



            /*
             * PRODUCT CARDS
             */

            grid.innerHTML =
                products.map(
                    product => {


                        const image =
                            product.images &&
                            product.images.length > 0
                                ? product.images[0]
                                : 'images/placeholder.jpg';



                        const material =
                            getMaterialName(
                                product.material
                            );



                        const title =
                            escapeHTML(
                                product.title
                            );



                        const safeImage =
                            escapeHTML(
                                image
                            );



                        const price =
                            Number(
                                product.price || 0
                            ).toLocaleString();



                        return `

                            <div
                                onclick="goToDetail('${product._id}')"
                                class="product-card"
                            >


                                <!-- PRODUCT IMAGE -->

                                <div class="product-image-box">


                                    <img
                                        src="${safeImage}"
                                        alt="${title}"
                                        class="product-image"
                                    >


                                    <span
                                        class="material-badge"
                                    >
                                        ${escapeHTML(material)}
                                    </span>


                                </div>



                                <!-- PRODUCT BODY -->

                                <div class="product-body">


                                    <div>

                                        <h3
                                            class="product-title"
                                        >
                                            ${title}
                                        </h3>


                                        <p
                                            class="product-description"
                                        >
                                            Premium Quality Watch
                                        </p>

                                    </div>



                                    <div
                                        class="product-bottom"
                                    >


                                        <span
                                            class="product-price"
                                        >
                                            Rs. ${price}
                                        </span>



                                        <button
                                            type="button"
                                            class="details-btn"
                                            onclick="event.stopPropagation(); goToDetail('${product._id}')"
                                        >

                                            <span>
                                                Details
                                            </span>

                                            <i
                                                class="fa-solid fa-chevron-right"
                                            ></i>

                                        </button>


                                    </div>


                                </div>


                            </div>

                        `;

                    }
                ).join('');

        }



        /* =====================================================
           PRODUCT DETAIL PAGE
        ====================================================== */

        function goToDetail(productId) {

            window.location.href =
                `product-detail.html?id=${productId}`;

        }



        /* =====================================================
           PAGE LOAD
        ====================================================== */

        document.addEventListener(
            'DOMContentLoaded',
            fetchMenProducts
        );


    </script>

</body>
</html>
