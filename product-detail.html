
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Product Details - Bolani Watches
    </title>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <style>

        @import url(
            'https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap'
        );


        /* =====================================================
           GLOBAL RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background-color: #f6f5f2;

            font-family:
                'Plus Jakarta Sans',
                sans-serif;

            color: #3e4656;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        button,
        input,
        select {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        img {
            display: block;
        }


        .font-heading {
            font-family: 'Cinzel', serif;
        }


        /* =====================================================
           COMMON
        ====================================================== */

        .hidden {
            display: none !important;
        }


        .text-center {
            text-align: center;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .top-header {
            width: 100%;

            background: rgba(
                246,
                245,
                242,
                0.90
            );

            border-bottom:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.20
                );

            position: sticky;

            top: 0;

            z-index: 50;

            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);
        }


        .header-container {
            width: 100%;

            max-width: 1280px;

            margin: 0 auto;

            padding:
                12px 16px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        /* =====================================================
           LOGO
        ====================================================== */

        .logo-link {
            text-decoration: none;

            display: flex;

            flex-direction: column;
        }


        .logo-main {
            font-family: 'Cinzel', serif;

            font-size: 20px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing: 0.08em;

            color: #1d2b3a;

            transition: color 0.3s ease;
        }


        .logo-link:hover .logo-main {
            color: #8c7a5b;
        }


        /* =====================================================
           BACK BUTTON
        ====================================================== */

        .back-button {
            border: none;

            background: transparent;

            color: #1d2b3a;

            font-size: 12px;

            font-weight: 600;

            display: flex;

            align-items: center;

            gap: 5px;

            transition:
                color 0.3s ease;
        }


        .back-button:hover {
            color: #8c7a5b;

            text-decoration: underline;
        }


        /* =====================================================
           MAIN
        ====================================================== */

        .main-container {
            width: 100%;

            max-width: 1280px;

            margin: 0 auto;

            padding:
                24px 12px;

            flex: 1;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading-state {
            text-align: center;

            padding:
                80px 20px;
        }


        .loading-state i {
            font-size: 36px;

            color: #1d2b3a;
        }


        .loading-state p {
            margin-top: 12px;

            font-size: 13px;

            font-weight: 600;

            color: #6b7280;
        }


        /* =====================================================
           PRODUCT CONTAINER
        ====================================================== */

        .product-container {
            width: 100%;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 40px;

            align-items: start;
        }


        /* =====================================================
           COMMON WHITE CARD
        ====================================================== */

        .product-card-box {
            background: #ffffff;

            padding: 20px;

            border-radius: 16px;

            border:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.25
                );

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.05
                );
        }


        /* =====================================================
           MAIN IMAGE
        ====================================================== */

        .main-image-wrapper {
            position: relative;

            width: 100%;

            height: 384px;

            background: #f6f5f2;

            border-radius: 12px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 8px;
        }


        .main-product-image {
            max-width: 100%;

            max-height: 100%;

            width: auto;

            height: auto;

            object-fit: contain;

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        /* =====================================================
           IMAGE NAVIGATION BUTTONS
        ====================================================== */

        .image-nav-button {
            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            width: 32px;

            height: 32px;

            border: none;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.80
                );

            color: #1d2b3a;

            box-shadow:
                0 3px 10px
                rgba(
                    0,
                    0,
                    0,
                    0.12
                );

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.3s ease,
                transform 0.3s ease;
        }


        .image-nav-button:hover {
            background: #ffffff;

            transform:
                translateY(-50%)
                scale(1.05);
        }


        .prev-button {
            left: 8px;
        }


        .next-button {
            right: 8px;
        }


        .image-nav-button i {
            font-size: 11px;
        }


        /* =====================================================
           IMAGE COUNTER
        ====================================================== */

        .image-counter {
            position: absolute;

            bottom: 8px;

            right: 8px;

            background:
                rgba(
                    29,
                    43,
                    58,
                    0.80
                );

            color: #ffffff;

            font-size: 10px;

            font-weight: 700;

            padding:
                3px 8px;

            border-radius: 6px;
        }


        /* =====================================================
           THUMBNAILS
        ====================================================== */

        .thumbnail-strip {
            display: flex;

            gap: 8px;

            margin-top: 12px;

            overflow-x: auto;

            padding-bottom: 4px;

            scrollbar-width: none;

            -ms-overflow-style: none;
        }


        .thumbnail-strip::-webkit-scrollbar {
            display: none;
        }


        .thumb-button {
            width: 56px;

            height: 56px;

            flex-shrink: 0;

            border-radius: 8px;

            background: #f6f5f2;

            border:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.30
                );

            padding: 4px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }


        .thumb-button.active {
            border-color: #1d2b3a;

            box-shadow:
                0 0 0 2px
                #1d2b3a;
        }


        .thumb-button img {
            width: 100%;

            height: 100%;

            object-fit: contain;
        }


        /* =====================================================
           DESCRIPTION
        ====================================================== */

        .description-box {
            margin-top: 16px;

            padding-top: 16px;

            border-top:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.20
                );
        }


        .description-title {
            font-size: 14px;

            font-weight: 700;

            color: #1d2b3a;
        }


        .description-text {
            margin-top: 4px;

            font-size: 12px;

            line-height: 1.7;

            color: #6b7280;
        }


        /* =====================================================
           PRODUCT INFO
        ====================================================== */

        .product-info-box {
            background: #ffffff;

            padding: 24px;

            border-radius: 16px;

            border:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.25
                );

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.05
                );
        }


        /* =====================================================
           PRODUCT HEADER
        ====================================================== */

        .product-header {
            border-bottom:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.20
                );

            padding-bottom: 16px;
        }


        .stock-badge {
            display: inline-block;

            background: #8c7a5b;

            color: #ffffff;

            font-size: 10px;

            font-weight: 700;

            padding:
                3px 8px;

            border-radius: 999px;

            text-transform: uppercase;

            letter-spacing: 0.08em;
        }


        .product-title {
            font-family: 'Cinzel', serif;

            font-size: 24px;

            line-height: 1.3;

            font-weight: 700;

            color: #1d2b3a;

            margin-top: 8px;
        }


        .price-row {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-top: 8px;

            flex-wrap: wrap;
        }


        .product-price {
            font-size: 30px;

            font-weight: 800;

            color: #1d2b3a;
        }


        .discount-tag {
            background: #dcfce7;

            color: #15803d;

            font-size: 11px;

            font-weight: 700;

            padding:
                5px 8px;

            border-radius: 6px;
        }


        /* =====================================================
           ORDER FORM
        ====================================================== */

        .order-form {
            margin-top: 16px;

            display: flex;

            flex-direction: column;

            gap: 16px;
        }


        .form-heading {
            font-size: 14px;

            font-weight: 700;

            color: #1d2b3a;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .form-heading i {
            color: #8c7a5b;

            font-size: 15px;
        }


        /* =====================================================
           FORM GROUP
        ====================================================== */

        .form-group {
            width: 100%;
        }


        .form-label {
            display: block;

            font-size: 12px;

            font-weight: 700;

            color: #3e4656;

            margin-bottom: 4px;
        }


        .form-input,
        .form-select {
            width: 100%;

            background: #f6f5f2;

            border:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.30
                );

            border-radius: 10px;

            padding:
                9px 12px;

            font-size: 13px;

            color: #1d2b3a;

            outline: none;

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }


        .form-input::placeholder {
            color: #9ca3af;
        }


        .form-input:focus,
        .form-select:focus {
            border-color: #1d2b3a;

            box-shadow:
                0 0 0 2px
                rgba(
                    29,
                    43,
                    58,
                    0.12
                );
        }


        /* =====================================================
           QUANTITY BOX
        ====================================================== */

        .quantity-box {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            align-items: center;

            background: #f6f5f2;

            padding: 12px;

            border-radius: 10px;

            border:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.20
                );
        }


        .quantity-label {
            display: block;

            font-size: 12px;

            font-weight: 700;

            color: #3e4656;

            margin-bottom: 4px;
        }


        .quantity-controls {
            display: flex;

            align-items: center;

            gap: 8px;
        }


        .quantity-button {
            width: 32px;

            height: 32px;

            border:
                1px solid
                rgba(
                    153,
                    154,
                    144,
                    0.30
                );

            border-radius: 8px;

            background: #ffffff;

            color: #1d2b3a;

            font-size: 16px;

            font-weight: 700;

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }


        .quantity-button:hover {
            background: #1d2b3a;

            color: #ffffff;
        }


        .quantity-display {
            width: 24px;

            text-align: center;

            font-size: 14px;

            font-weight: 700;

            color: #1d2b3a;
        }


        /* =====================================================
           TOTAL PRICE
        ====================================================== */

        .total-box {
            text-align: right;
        }


        .total-label {
            display: block;

            font-size: 10px;

            color: #6b7280;

            font-weight: 600;
        }


        .total-price {
            font-size: 20px;

            font-weight: 800;

            color: #1d2b3a;

            display: block;

            margin-top: 2px;
        }


        .discount-text {
            display: block;

            font-size: 9px;

            color: #16a34a;

            font-weight: 700;

            margin-top: 2px;
        }


        /* =====================================================
           WHATSAPP BUTTON
        ====================================================== */

        .whatsapp-button {
            width: 100%;

            border: none;

            background: #25D366;

            color: #ffffff;

            padding:
                12px 16px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 700;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            box-shadow:
                0 4px 12px
                rgba(
                    37,
                    211,
                    102,
                    0.20
                );

            transition:
                background 0.3s ease,
                transform 0.2s ease;
        }


        .whatsapp-button:hover {
            background: #1ebd59;

            transform: translateY(-1px);
        }


        .whatsapp-button i {
            font-size: 18px;
        }


        /* =====================================================
           SAFE ORDER TEXT
        ====================================================== */

        .safe-order-text {
            text-align: center;

            font-size: 10px;

            color: #6b7280;

            margin-top: -4px;
        }


        .safe-order-text i {
            margin-right: 3px;
        }


        /* =====================================================
           FOOTER
        ====================================================== */

        .footer {
            width: 100%;

            background: #3e4656;

            color: #ffffff;

            text-align: center;

            padding: 16px;

            font-size: 12px;

            margin-top: 32px;
        }


        .footer strong {
            color: #f6f5f2;
        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 900px) {

            .product-container {
                grid-template-columns: 1fr;

                gap: 20px;
            }


            .main-image-wrapper {
                height: 384px;
            }


            .product-info-box {
                padding: 20px;
            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 640px) {

            .header-container {
                padding:
                    14px 16px;
            }


            .logo-main {
                font-size: 18px;
            }


            .back-button {
                font-size: 11px;
            }


            .main-container {
                padding:
                    20px 12px;
            }


            .product-container {
                gap: 16px;
            }


            .product-card-box {
                padding: 12px;

                border-radius: 14px;
            }


            .product-info-box {
                padding: 16px;

                border-radius: 14px;
            }


            .main-image-wrapper {
                height: 288px;

                border-radius: 10px;
            }


            .product-title {
                font-size: 20px;
            }


            .product-price {
                font-size: 24px;
            }


            .description-title {
                font-size: 13px;
            }


            .description-text {
                font-size: 11px;
            }


            .quantity-box {
                gap: 8px;

                padding: 10px;
            }


            .whatsapp-button {
                font-size: 13px;

                padding:
                    11px 12px;
            }


            .footer {
                margin-top: 20px;

                padding: 14px;

                font-size: 11px;
            }

        }


        /* =====================================================
           VERY SMALL MOBILE
        ====================================================== */

        @media (max-width: 380px) {

            .logo-main {
                font-size: 16px;
            }


            .back-button {
                font-size: 10px;
            }


            .main-image-wrapper {
                height: 250px;
            }


            .product-title {
                font-size: 18px;
            }


            .product-price {
                font-size: 22px;
            }


            .quantity-box {
                grid-template-columns:
                    1fr;
            }


            .total-box {
                text-align: left;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="top-header">

        <div class="header-container">


            <!-- LOGO -->

           <!-- LOGO (Ab Click karne par pichhe (Back) chala jayega) -->
<button onclick="history.back()" class="logo-link" style="background: none; border: none; cursor: pointer; padding: 0;">
    <span class="logo-main">
        BOLANI WATCHES
    </span>
</button>

<!-- BACK BUTTON -->
<button onclick="history.back()" class="back-button">
    <i class="fa-solid fa-arrow-left"></i>
    Go Back
</button>

        </div>

    </header>



    <!-- =====================================================
         MAIN PRODUCT SECTION
    ====================================================== -->

    <main class="main-container">


        <!-- =================================================
             LOADING
        ================================================== -->

        <div
            id="loadingState"
            class="loading-state"
        >

            <i
                class="fa-solid fa-circle-notch fa-spin"
            ></i>

            <p>
                Loading Product Details...
            </p>

        </div>



        <!-- =================================================
             PRODUCT CONTAINER
        ================================================== -->

        <div
            id="productContainer"
            class="product-container hidden"
        >


            <!-- =================================================
                 LEFT COLUMN
            ================================================== -->

            <div class="product-card-box">


                <!-- MAIN IMAGE -->

                <div class="main-image-wrapper">


                    <img
                        id="mainImage"
                        src=""
                        alt="Product Image"
                        class="main-product-image"
                    >


                    <!-- PREVIOUS -->

                    <button
                        id="prevBtn"
                        onclick="prevImage()"
                        class="image-nav-button prev-button"
                        type="button"
                    >

                        <i class="fa-solid fa-chevron-left"></i>

                    </button>


                    <!-- NEXT -->

                    <button
                        id="nextBtn"
                        onclick="nextImage()"
                        class="image-nav-button next-button"
                        type="button"
                    >

                        <i class="fa-solid fa-chevron-right"></i>

                    </button>


                    <!-- COUNTER -->

                    <span
                        id="imageCounter"
                        class="image-counter"
                    >
                        1 / 1
                    </span>

                </div>



                <!-- THUMBNAILS -->

                <div
                    id="thumbnailStrip"
                    class="thumbnail-strip"
                >

                    <!-- Dynamically generated -->

                </div>



                <!-- DESCRIPTION -->

                <div class="description-box">

                    <h3 class="description-title">
                        Description:
                    </h3>

                    <p
                        id="productDescription"
                        class="description-text"
                    >
                        <!-- Dynamic -->

                    </p>

                </div>

            </div>



            <!-- =================================================
                 RIGHT COLUMN
            ================================================== -->

            <div class="product-info-box">


                <!-- PRODUCT HEADER -->

                <div class="product-header">


                    <span
                        id="productBadge"
                        class="stock-badge"
                    >
                        In Stock
                    </span>


                    <h1
                        id="productTitle"
                        class="product-title"
                    >
                        <!-- Dynamic -->
                    </h1>


                    <div class="price-row">


                        <span
                            id="productPrice"
                            class="product-price"
                        >
                            Rs. 0
                        </span>


                        <span
                            id="discountTag"
                            class="discount-tag hidden"
                        >
                            Bulk Discount Available!
                        </span>

                    </div>

                </div>



                <!-- =================================================
                     ORDER FORM
                ================================================== -->

                <form
                    id="orderForm"
                    onsubmit="handleOrderSubmit(event)"
                    class="order-form"
                >


                    <h2 class="form-heading">

                        <i
                            class="fa-solid fa-cart-shopping"
                        ></i>

                        Quick Order Form

                    </h2>



                    <!-- CUSTOMER NAME -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="custName"
                        >
                            Your Full Name *
                        </label>

                        <input
                            type="text"
                            id="custName"
                            required
                            placeholder="Aapka Naam"
                            class="form-input"
                        >

                    </div>



                    <!-- ADDRESS -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="custAddress"
                        >
                            Complete Address / City *
                        </label>

                        <input
                            type="text"
                            id="custAddress"
                            required
                            placeholder="Ghar ka address aur shehar ka naam"
                            class="form-input"
                        >

                    </div>



                    <!-- PHONE -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="custPhone"
                        >
                            Phone Number (WhatsApp) *
                        </label>

                        <input
                            type="tel"
                            id="custPhone"
                            required
                            placeholder="03xx-xxxxxxx"
                            class="form-input"
                        >

                    </div>



                    <!-- COLOR -->

                    <div
                        id="colorSelectionSection"
                        class="form-group hidden"
                    >

                        <label
                            class="form-label"
                            for="colorSelect"
                        >
                            Select Color Choice *
                        </label>

                        <select
                            id="colorSelect"
                            class="form-select"
                        >

                            <!-- Dynamic -->

                        </select>

                    </div>



                    <!-- IMAGE VARIANT -->

                    <div class="form-group">

                        <label
                            class="form-label"
                            for="imageVariantSelect"
                        >
                            Which Image Variant Do You Prefer? *
                        </label>

                        <select
                            id="imageVariantSelect"
                            class="form-select"
                        >

                            <!-- Dynamic -->

                        </select>

                    </div>



                    <!-- =================================================
                         QUANTITY
                    ================================================== -->

                    <div class="quantity-box">


                        <!-- QUANTITY -->

                        <div>

                            <label class="quantity-label">
                                Quantity:
                            </label>


                            <div class="quantity-controls">


                                <button
                                    type="button"
                                    onclick="changeQty(-1)"
                                    class="quantity-button"
                                >
                                    -
                                </button>


                                <span
                                    id="qtyDisplay"
                                    class="quantity-display"
                                >
                                    1
                                </span>


                                <button
                                    type="button"
                                    onclick="changeQty(1)"
                                    class="quantity-button"
                                >
                                    +
                                </button>


                            </div>

                        </div>



                        <!-- TOTAL -->

                        <div class="total-box">

                            <span class="total-label">
                                Total Payable:
                            </span>


                            <span
                                id="totalPriceDisplay"
                                class="total-price"
                            >
                                Rs. 0
                            </span>


                            <span
                                id="discountText"
                                class="discount-text"
                            ></span>

                        </div>

                    </div>



                    <!-- =================================================
                         WHATSAPP
                    ================================================== -->

                    <button
                        type="submit"
                        class="whatsapp-button"
                    >

                        <i class="fa-brands fa-whatsapp"></i>

                        <span>
                            Order Now via WhatsApp
                        </span>

                    </button>



                    <!-- SAFE ORDER -->

                    <p class="safe-order-text">

                        <i class="fa-solid fa-shield-halved"></i>

                        Safe & Fast Cash on Delivery Order

                    </p>


                </form>

            </div>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <p>

            Web Created By

            <strong>
                @Amin Bolani
            </strong>

        </p>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           OWNER WHATSAPP
        ====================================================== */

        const OWNER_WHATSAPP =
            "923252704588";


        let currentProduct = null;

        let activeImageIndex = 0;

        let selectedQuantity = 1;



        /* =====================================================
           1. LOAD PRODUCT
        ====================================================== */

        async function loadProductDetail() {


            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            const productId =
                urlParams.get('id');


            if (!productId) {

                alert(
                    "Product reference missing!"
                );

                window.location.href =
                    "index.html";

                return;

            }


            try {


                const response =
                    await fetch(
                        `https://watches-backend-cyan.vercel.app/api/products/${productId}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "API Failed"
                    );

                }


                currentProduct =
                    await response.json();


            } catch (error) {


                console.log(
                    "Loading fallback mock product data:",
                    error
                );


                /* =============================================
                   FALLBACK DATA
                ============================================== */

                currentProduct = {

                    _id: productId,

                    title:
                        "Imperium Luxury Gold Edition",

                    price: 8500,

                    description:
                        "High-quality luxury timepiece crafted with water-resistant stainless steel dial, quartz movement, and premium finish.",

                    colors: [
                        "Golden",
                        "Silver",
                        "Black Matte"
                    ],

                    images: [

                        "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=600",

                        "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600",

                        "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"

                    ]

                };

            }


            renderProductDetails();

        }



        /* =====================================================
           2. RENDER PRODUCT
        ====================================================== */

        function renderProductDetails() {


            document
                .getElementById(
                    'loadingState'
                )
                .classList.add(
                    'hidden'
                );


            document
                .getElementById(
                    'productContainer'
                )
                .classList.remove(
                    'hidden'
                );


            /* =============================================
               TITLE
            ============================================== */

            document
                .getElementById(
                    'productTitle'
                )
                .innerText =
                currentProduct.title ||
                "Bolani Watch";


            /* =============================================
               PRICE
            ============================================== */

            document
                .getElementById(
                    'productPrice'
                )
                .innerText =
                `Rs. ${Number(
                    currentProduct.price || 0
                ).toLocaleString()}`;


            /* =============================================
               DESCRIPTION
            ============================================== */

            document
                .getElementById(
                    'productDescription'
                )
                .innerText =
                currentProduct.description ||
                "No description provided.";


            /* =============================================
               IMAGES
            ============================================== */

            updateCarouselImage();

            renderThumbnails();

            populateImageVariantDropdown();


            /* =============================================
               COLORS
            ============================================== */

            const colorSection =
                document.getElementById(
                    'colorSelectionSection'
                );


            const colorSelect =
                document.getElementById(
                    'colorSelect'
                );


            if (
                currentProduct.colors &&
                currentProduct.colors.length > 0
            ) {


                colorSection
                    .classList
                    .remove(
                        'hidden'
                    );


                colorSelect.innerHTML =
                    currentProduct.colors
                        .map(
                            color =>
                                `<option value="${color}">
                                    ${color}
                                </option>`
                        )
                        .join('');


            } else {


                colorSection
                    .classList
                    .add(
                        'hidden'
                    );

            }


            /* =============================================
               INITIAL TOTAL
            ============================================== */

            calculateTotal();

        }



        /* =====================================================
           3. UPDATE CAROUSEL
        ====================================================== */

        function updateCarouselImage() {


            const images =
                currentProduct.images &&
                currentProduct.images.length > 0

                    ? currentProduct.images

                    : [
                        'images/placeholder.jpg'
                    ];


            if (
                activeImageIndex >=
                images.length
            ) {

                activeImageIndex = 0;

            }


            const mainImage =
                document.getElementById(
                    'mainImage'
                );


            mainImage.src =
                images[
                    activeImageIndex
                ];


            document
                .getElementById(
                    'imageCounter'
                )
                .innerText =
                `${activeImageIndex + 1} / ${images.length}`;


            /* =============================================
               ACTIVE THUMBNAIL
            ============================================== */

            document
                .querySelectorAll(
                    '.thumb-button'
                )
                .forEach(
                    (thumb, index) => {


                        if (
                            index ===
                            activeImageIndex
                        ) {

                            thumb
                                .classList
                                .add(
                                    'active'
                                );

                        } else {

                            thumb
                                .classList
                                .remove(
                                    'active'
                                );

                        }

                    }
                );

        }



        /* =====================================================
           4. NEXT IMAGE
        ====================================================== */

        function nextImage() {


            const images =
                currentProduct.images || [];


            if (
                images.length === 0
            ) {

                return;

            }


            activeImageIndex =
                (
                    activeImageIndex + 1
                ) %
                images.length;


            updateCarouselImage();

        }



        /* =====================================================
           5. PREVIOUS IMAGE
        ====================================================== */

        function prevImage() {


            const images =
                currentProduct.images || [];


            if (
                images.length === 0
            ) {

                return;

            }


            activeImageIndex =
                (
                    activeImageIndex - 1 +
                    images.length
                ) %
                images.length;


            updateCarouselImage();

        }



        /* =====================================================
           6. RENDER THUMBNAILS
        ====================================================== */

        function renderThumbnails() {


            const strip =
                document.getElementById(
                    'thumbnailStrip'
                );


            const images =
                currentProduct.images || [];


            if (
                images.length <= 1
            ) {

                strip
                    .classList
                    .add(
                        'hidden'
                    );

                return;

            }


            strip
                .classList
                .remove(
                    'hidden'
                );


            strip.innerHTML =
                images
                    .map(
                        (img, index) => `

                            <button
                                type="button"
                                onclick="selectImage(${index})"
                                class="thumb-button"
                            >

                                <img
                                    src="${img}"
                                    alt="Product Image ${index + 1}"
                                >

                            </button>

                        `
                    )
                    .join('');


            updateCarouselImage();

        }



        /* =====================================================
           7. SELECT IMAGE
        ====================================================== */

        function selectImage(index) {


            activeImageIndex =
                index;


            updateCarouselImage();


            document
                .getElementById(
                    'imageVariantSelect'
                )
                .value =
                `Image Variant ${index + 1}`;

        }



        /* =====================================================
           8. IMAGE VARIANT DROPDOWN
        ====================================================== */

        function populateImageVariantDropdown() {


            const variantSelect =
                document.getElementById(
                    'imageVariantSelect'
                );


            const images =
                currentProduct.images || [];


            variantSelect.innerHTML =
                images
                    .map(
                        (_, index) => `

                            <option
                                value="Image Variant ${index + 1}"
                            >
                                Image Variant #${index + 1}
                            </option>

                        `
                    )
                    .join('');

        }



        /* =====================================================
           9. QUANTITY
        ====================================================== */

        function changeQty(change) {


            selectedQuantity =
                Math.max(
                    1,
                    selectedQuantity + change
                );


            document
                .getElementById(
                    'qtyDisplay'
                )
                .innerText =
                selectedQuantity;


            calculateTotal();

        }



        /* =====================================================
           10. CALCULATE TOTAL
        ====================================================== */

        function calculateTotal() {


            const unitPrice =
                Number(
                    currentProduct.price || 0
                );


            let discountPercent = 0;


            /*
             * 2 WATCHES = 5%
             *
             * 3+ WATCHES = 10%
             */

            if (
                selectedQuantity === 2
            ) {

                discountPercent = 5;

            }

            else if (
                selectedQuantity >= 3
            ) {

                discountPercent = 10;

            }


            const subtotal =
                unitPrice *
                selectedQuantity;


            const discountAmount =
                (
                    subtotal *
                    discountPercent
                ) / 100;


            const finalTotal =
                subtotal -
                discountAmount;


            document
                .getElementById(
                    'totalPriceDisplay'
                )
                .innerText =
                `Rs. ${finalTotal.toLocaleString()}`;


            const discountTag =
                document.getElementById(
                    'discountTag'
                );


            const discountText =
                document.getElementById(
                    'discountText'
                );


            if (
                discountPercent > 0
            ) {


                discountTag
                    .classList
                    .remove(
                        'hidden'
                    );


                discountText.innerText =
                    `${discountPercent}% Discount Applied (-Rs. ${discountAmount.toLocaleString()})`;


            } else {


                discountTag
                    .classList
                    .add(
                        'hidden'
                    );


                discountText.innerText =
                    "";

            }

        }



        /* =====================================================
           11. ORDER SUBMIT
        ====================================================== */

        function handleOrderSubmit(event) {


            event.preventDefault();


            /* =============================================
               CUSTOMER DATA
            ============================================== */

            const name =
                document
                    .getElementById(
                        'custName'
                    )
                    .value;


            const address =
                document
                    .getElementById(
                        'custAddress'
                    )
                    .value;


            const phone =
                document
                    .getElementById(
                        'custPhone'
                    )
                    .value;



            /* =============================================
               COLOR
            ============================================== */

            const colorSelect =
                document.getElementById(
                    'colorSelect'
                );


            const colorSection =
                document.getElementById(
                    'colorSelectionSection'
                );


            const selectedColor =
                (
                    colorSelect &&
                    !colorSection
                        .classList
                        .contains(
                            'hidden'
                        )
                )

                    ? colorSelect.value

                    : "Standard";



            /* =============================================
               IMAGE VARIANT
            ============================================== */

            const selectedImgVariant =
                document
                    .getElementById(
                        'imageVariantSelect'
                    )
                    .value;



            /* =============================================
               TOTAL
            ============================================== */

            const totalPrice =
                document
                    .getElementById(
                        'totalPriceDisplay'
                    )
                    .innerText;



            /* =============================================
               IMAGE URL
            ============================================== */

            const selectedImgUrl =
                currentProduct.images &&
                currentProduct.images[
                    activeImageIndex
                ]

                    ? currentProduct.images[
                        activeImageIndex
                    ]

                    : "N/A";



            /* =============================================
               WHATSAPP MESSAGE
            ============================================== */

            const message =

                `🛍️ *NEW WATCH ORDER - BOLANI WATCHES* 🛍️\n\n` +

                `*Product:* ${currentProduct.title}\n` +

                `*Selected Color:* ${selectedColor}\n` +

                `*Selected Variant:* ${selectedImgVariant}\n` +

                `*Quantity:* ${selectedQuantity}\n` +

                `*Total Price:* ${totalPrice}\n\n` +

                `👤 *Customer Details:*\n` +

                `• *Name:* ${name}\n` +

                `• *Phone:* ${phone}\n` +

                `• *Address:* ${address}\n\n` +

                `🖼️ *Image Link:* ${selectedImgUrl}\n\n` +

                `Please confirm my order!`;



            /* =============================================
               WHATSAPP REDIRECT
            ============================================== */

            const whatsappUrl =
                `https://wa.me/${OWNER_WHATSAPP}?text=${encodeURIComponent(
                    message
                )}`;


            window.open(
                whatsappUrl,
                '_blank'
            );

        }



        /* =====================================================
           12. IMAGE VARIANT CHANGE
        ====================================================== */

        document
            .getElementById(
                'imageVariantSelect'
            )
            .addEventListener(
                'change',
                function () {


                    const selectedValue =
                        this.value;


                    const index =
                        parseInt(
                            selectedValue
                                .replace(
                                    'Image Variant ',
                                    ''
                                )
                        ) - 1;


                    if (
                        !isNaN(index)
                    ) {

                        activeImageIndex =
                            index;


                        updateCarouselImage();

                    }

                }
            );



        /* =====================================================
           13. INITIALIZE PAGE
        ====================================================== */

        document.addEventListener(
            'DOMContentLoaded',
            function () {

                loadProductDetail();

            }
        );

    </script>


</body>

</html>
