
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Couple Watches Collection - Bolani Watches</title>

    <!-- ======================================================
         FONT AWESOME
    ======================================================= -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- ======================================================
         GOOGLE FONTS
    ======================================================= -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');


        /* ==================================================
           GLOBAL RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;
            background-color: #f6f5f2;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #3e4656;

            display: flex;
            flex-direction: column;
        }


        button,
        select {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        a {
            text-decoration: none;
        }


        img {
            max-width: 100%;
        }


        /* ==================================================
           HEADING FONT
        ================================================== */

        .font-heading {
            font-family: 'Cinzel', serif;
        }


        /* ==================================================
           FLOATING WATCH ANIMATION
        ================================================== */

        @keyframes floatEffect {

            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(2deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }

        }


        .float-img {
            animation: floatEffect 3.5s ease-in-out infinite;
        }


        .float-delay-1 {
            animation-delay: 0.5s;
        }


        .float-delay-2 {
            animation-delay: 1s;
        }


        .float-delay-3 {
            animation-delay: 1.5s;
        }


        /* ==================================================
           HORIZONTAL SCROLLBAR HIDDEN
        ================================================== */

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }


        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }


        /* ==================================================
           TOP HEADER
        ================================================== */

        .top-header {
            width: 100%;
            background: rgba(246, 245, 242, 0.90);

            border-bottom: 1px solid rgba(153, 154, 144, 0.20);

            position: sticky;
            top: 0;
            z-index: 50;

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }


        .header-inner {
            width: 100%;
            max-width: 1280px;

            margin: 0 auto;

            padding: 16px 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        /* ==================================================
           LOGO
        ================================================== */

        .brand {
            display: flex;
            flex-direction: column;

            color: #1d2b3a;

            transition: color 0.3s ease;
        }


        .brand:hover {
            color: #8c7a5b;
        }


        .brand-title {
            font-family: 'Cinzel', serif;

            font-size: 30px;
            font-weight: 700;

            letter-spacing: 0.08em;

            line-height: 1.1;
        }


        .brand-subtitle {
            margin-top: 4px;

            font-size: 10px;

            letter-spacing: 0.20em;

            text-transform: uppercase;

            color: #6b7280;
        }


        /* ==================================================
           MAIN SITE LINK
        ================================================== */

        .main-site-link {
            display: flex;
            align-items: center;
            gap: 6px;

            color: #1d2b3a;

            font-size: 14px;
            font-weight: 600;

            white-space: nowrap;

            transition: opacity 0.3s ease;
        }


        .main-site-link:hover {
            opacity: 0.65;
        }


        /* ==================================================
           MAIN CONTAINER
        ================================================== */

        .page-container {
            width: 100%;
            max-width: 1280px;

            margin: 0 auto;

            padding-left: 24px;
            padding-right: 24px;
        }


        /* ==================================================
           SECTION 1
        ================================================== */

        .filter-section {
            width: 100%;

            padding-top: 24px;
            padding-bottom: 24px;
        }


        .collection-heading {
            text-align: center;

            margin-bottom: 24px;
        }


        .collection-heading h1 {
            font-family: 'Cinzel', serif;

            color: #1d2b3a;

            font-size: 36px;
            font-weight: 700;

            line-height: 1.25;
        }


        .collection-heading p {
            margin-top: 6px;

            color: #6b7280;

            font-size: 14px;
        }


        /* ==================================================
           CATEGORY FILTER ROW
        ================================================== */

        .category-row {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 24px;

            overflow-x: auto;

            padding-top: 8px;
            padding-bottom: 16px;
        }


        /* ==================================================
           CATEGORY BUTTON
        ================================================== */

        .category-btn {
            flex: 0 0 auto;

            width: 130px;

            min-height: 122px;

            padding: 12px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            border: 1px solid rgba(153, 154, 144, 0.30);

            border-radius: 16px;

            box-shadow: 0 2px 8px rgba(29, 43, 58, 0.06);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
        }


        .category-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(29, 43, 58, 0.12);
        }


        .category-btn.active {
            border-color: #1d2b3a;

            box-shadow:
                0 0 0 2px #1d2b3a,
                0 8px 20px rgba(29, 43, 58, 0.10);
        }


        .category-image-box {
            width: 64px;
            height: 64px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }


        .category-image-box img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        .category-name {
            margin-top: 8px;

            color: #1d2b3a;

            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;

            text-align: center;

            line-height: 1.25;
        }


        /* ==================================================
           PRICE FILTER BOX
        ================================================== */

        .price-filter-box {
            width: 100%;

            margin-top: 16px;

            padding: 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            flex-wrap: wrap;

            background: #ffffff;

            border: 1px solid rgba(153, 154, 144, 0.20);

            border-radius: 12px;
        }


        .active-filter {
            color: #1d2b3a;

            font-size: 14px;
            font-weight: 600;
        }


        .active-filter span {
            color: #8c7a5b;

            font-weight: 700;
        }


        .price-control {
            display: flex;
            align-items: center;

            gap: 8px;
        }


        .price-control label {
            color: #3e4656;

            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }


        #priceSort {
            min-width: 240px;

            padding: 8px 12px;

            background: #f6f5f2;

            color: #1d2b3a;

            border: 1px solid rgba(153, 154, 144, 0.30);

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            outline: none;

            cursor: pointer;

            transition: border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }


        #priceSort:focus {
            border-color: #1d2b3a;

            box-shadow:
                0 0 0 2px rgba(29, 43, 58, 0.10);
        }


        /* ==================================================
           PRODUCTS SECTION
        ================================================== */

        .products-section {
            width: 100%;

            flex: 1;

            padding-top: 16px;
            padding-bottom: 16px;
        }


        /* ==================================================
           PRODUCTS GRID
        ================================================== */

        #productsGrid {
            width: 100%;

            display: grid;

            grid-template-columns: repeat(4, minmax(0, 1fr));

            gap: 20px;
        }


        /* ==================================================
           PRODUCT CARD
        ================================================== */

        .product-card {
            width: 100%;

            background: #ffffff;

            border: 1px solid rgba(153, 154, 144, 0.25);

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 2px 8px rgba(29, 43, 58, 0.05);

            cursor: pointer;

            display: flex;
            flex-direction: column;

            justify-content: space-between;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .product-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 30px rgba(29, 43, 58, 0.15);
        }


        /* ==================================================
           PRODUCT IMAGE
        ================================================== */

        .product-image-container {
            position: relative;

            width: 100%;
            height: 210px;

            background: #f6f5f2;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 12px;
        }


        .product-image {
            width: 100%;
            height: 100%;

            object-fit: contain;

            transition:
                transform 0.5s ease;
        }


        .product-card:hover .product-image {
            transform: scale(1.10);
        }


        /* ==================================================
           PRODUCT TYPE BADGE
        ================================================== */

        .product-badge {
            position: absolute;

            top: 8px;
            left: 8px;

            background: #1d2b3a;

            color: #ffffff;

            font-size: 10px;
            font-weight: 700;

            padding: 4px 7px;

            border-radius: 999px;

            text-transform: uppercase;

            line-height: 1;
        }


        /* ==================================================
           PRODUCT BODY
        ================================================== */

        .product-body {
            padding: 16px;

            display: flex;
            flex-direction: column;

            justify-content: space-between;

            flex: 1;
        }


        .product-title {
            color: #1d2b3a;

            font-size: 16px;
            font-weight: 700;

            line-height: 1.3;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition: color 0.3s ease;
        }


        .product-card:hover .product-title {
            color: #8c7a5b;
        }


        .product-description {
            margin-top: 3px;

            color: #6b7280;

            font-size: 12px;
        }


        .product-bottom {
            margin-top: 12px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;
        }


        .product-price {
            color: #1d2b3a;

            font-size: 18px;
            font-weight: 700;

            white-space: nowrap;
        }


        .details-btn {
            border: none;

            background: #1d2b3a;

            color: #ffffff;

            font-size: 12px;
            font-weight: 600;

            padding: 8px 10px;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 5px;

            transition:
                background 0.3s ease,
                transform 0.2s ease;
        }


        .details-btn:hover {
            background: #8c7a5b;
        }


        .details-btn:active {
            transform: scale(0.96);
        }


        /* ==================================================
           LOADING STATE
        ================================================== */

        .loading-state {
            grid-column: 1 / -1;

            text-align: center;

            padding: 48px 20px;
        }


        .loading-state i {
            color: #1d2b3a;

            font-size: 30px;
        }


        .loading-state p {
            margin-top: 8px;

            color: #6b7280;

            font-size: 14px;
        }


        /* ==================================================
           EMPTY STATE
        ================================================== */

        .empty-state {
            grid-column: 1 / -1;

            text-align: center;

            padding: 48px 20px;

            background: #ffffff;

            border: 1px solid rgba(153, 154, 144, 0.20);

            border-radius: 16px;
        }


        .empty-state i {
            color: #999a90;

            font-size: 40px;

            margin-bottom: 8px;
        }


        .empty-state-title {
            color: #1d2b3a;

            font-size: 14px;
            font-weight: 600;
        }


        .empty-state-text {
            margin-top: 4px;

            color: #6b7280;

            font-size: 12px;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        .site-footer {
            width: 100%;

            margin-top: 32px;

            padding: 16px;

            background: #3e4656;

            color: #ffffff;

            text-align: center;

            font-size: 14px;
        }


        .site-footer strong {
            color: #f6f5f2;
        }


        /* ==================================================
           TABLET
        ================================================== */

        @media (max-width: 900px) {

            #productsGrid {
                grid-template-columns: repeat(3, minmax(0, 1fr));

                gap: 12px;
            }


            .product-image-container {
                height: 170px;
            }


            .category-row {
                justify-content: flex-start;
            }

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 640px) {

            .page-container {
                padding-left: 12px;
                padding-right: 12px;
            }


            /* Header */

            .header-inner {
                padding: 14px 12px;
            }


            .brand-title {
                font-size: 22px;

                letter-spacing: 0.05em;
            }


            .brand-subtitle {
                font-size: 8px;

                letter-spacing: 0.14em;
            }


            .main-site-link {
                font-size: 12px;
            }


            /* Heading */

            .filter-section {
                padding-top: 20px;
                padding-bottom: 16px;
            }


            .collection-heading {
                margin-bottom: 18px;
            }


            .collection-heading h1 {
                font-size: 24px;
            }


            .collection-heading p {
                font-size: 11px;
            }


            /* Categories */

            .category-row {
                justify-content: flex-start;

                gap: 10px;

                padding-bottom: 14px;
            }


            .category-btn {
                width: 85px;

                min-height: 102px;

                padding: 8px;

                border-radius: 14px;
            }


            .category-image-box {
                width: 48px;
                height: 48px;
            }


            .category-name {
                font-size: 10px;

                margin-top: 6px;
            }


            /* Price Filter */

            .price-filter-box {
                padding: 12px;

                flex-direction: column;

                align-items: stretch;

                gap: 10px;
            }


            .active-filter {
                font-size: 12px;
            }


            .price-control {
                width: 100%;

                display: flex;
                flex-direction: column;

                align-items: stretch;

                gap: 5px;
            }


            .price-control label {
                font-size: 11px;
            }


            #priceSort {
                width: 100%;

                min-width: 0;

                font-size: 12px;
            }


            /* Products */

            .products-section {
                padding-top: 8px;
            }


            #productsGrid {
                grid-template-columns: repeat(3, minmax(0, 1fr));

                gap: 8px;
            }


            .product-card {
                border-radius: 12px;
            }


            .product-image-container {
                height: 112px;

                padding: 4px;
            }


            .product-badge {
                top: 4px;
                left: 4px;

                font-size: 8px;

                padding: 3px 5px;
            }


            .product-body {
                padding: 6px;
            }


            .product-title {
                font-size: 10px;
            }


            .product-description {
                display: none;
            }


            .product-bottom {
                margin-top: 6px;

                flex-direction: column;

                align-items: stretch;

                gap: 5px;
            }


            .product-price {
                font-size: 11px;
            }


            .details-btn {
                width: 100%;

                padding: 5px 4px;

                font-size: 9px;

                border-radius: 6px;
            }


            .details-btn i {
                font-size: 7px;
            }


            /* Footer */

            .site-footer {
                margin-top: 20px;

                padding: 12px;

                font-size: 11px;
            }


            /* Empty state */

            .empty-state {
                padding: 35px 12px;
            }

        }


        /* ==================================================
           VERY SMALL MOBILE
        ================================================== */

        @media (max-width: 380px) {

            .brand-title {
                font-size: 19px;
            }


            .main-site-link {
                font-size: 10px;
            }


            .category-btn {
                width: 78px;
            }


            #productsGrid {
                gap: 6px;
            }


            .product-image-container {
                height: 100px;
            }


            .product-title {
                font-size: 9px;
            }


            .product-price {
                font-size: 10px;
            }

        }
    </style>
</head>

<script>

/* ==================================================
   COUPLE PRODUCTS
   DATABASE FIELD:
   category = "couple"
   material = "Luxury" / "Casual" / "Gift Sets"
================================================== */


/* ==================================================
   1. GLOBAL VARIABLES
================================================== */

let allProducts = [];

let currentCoupleType = 'ALL';



/* ==================================================
   2. FETCH COUPLE PRODUCTS FROM BACKEND
================================================== */

async function fetchCoupleProducts() {

    try {

        const response = await fetch(
            'https://watches-backend-cyan.vercel.app/api/products?category=couple'
        );


        if (!response.ok) {

            throw new Error('API error');

        }


        allProducts = await response.json();


        console.log(
            'Couple products loaded:',
            allProducts
        );


        applyFilters();


    } catch (error) {

        console.error(
            'Couple products fetch error:',
            error
        );


        /*
         * IMPORTANT:
         * No fake products now.
         *
         * If backend is unavailable,
         * simply show empty state.
         */

        allProducts = [];

        applyFilters();

    }

}



/* ==================================================
   3. COUPLE CATEGORY FILTER
================================================== */

function filterCoupleType(type) {

    currentCoupleType = type;


    /*
     * UPDATE ACTIVE BUTTON
     */

    document
        .querySelectorAll('.category-btn')
        .forEach(btn => {

            if (
                btn.getAttribute('data-couple') === type
            ) {

                btn.classList.add('active');

            } else {

                btn.classList.remove('active');

            }

        });



    /*
     * UPDATE ACTIVE FILTER TEXT
     */

    const labels = {

        ALL:
            'ALL COUPLES',

        LUXURY:
            '💎 LUXURY COUPLE',

        CASUAL:
            '✨ CASUAL COUPLE',

        'GIFT SETS':
            '🎁 GIFT SETS'

    };


    const activeFilterLabel =
        document.getElementById('activeFilterLabel');


    if (activeFilterLabel) {

        activeFilterLabel.innerText =
            labels[type] || type;

    }


    applyFilters();

}



/* ==================================================
   4. COMBINED FILTER
================================================== */

function applyFilters() {

    let filtered =
        [...allProducts];


    /*
     * COUPLE TYPE / MATERIAL FILTER
     *
     * Dashboard saves:
     *
     * material = Luxury
     * material = Casual
     * material = Gift Sets
     *
     * So we read product.material
     */

    if (currentCoupleType !== 'ALL') {

        filtered =
            filtered.filter(product => {

                const material =
                    String(
                        product.material || ''
                    )
                    .trim()
                    .toUpperCase();


                return material ===
                    currentCoupleType
                    .toUpperCase();

            });

    }



    /*
     * PRICE FILTER
     */

    const priceSort =
        document.getElementById('priceSort');


    const priceVal =
        priceSort
            ? priceSort.value
            : 'DEFAULT';



    /*
     * LOW TO HIGH
     */

    if (priceVal === 'LOW_HIGH') {

        filtered.sort(
            (a, b) =>
                Number(a.price || 0) -
                Number(b.price || 0)
        );

    }



    /*
     * HIGH TO LOW
     */

    else if (priceVal === 'HIGH_LOW') {

        filtered.sort(
            (a, b) =>
                Number(b.price || 0) -
                Number(a.price || 0)
        );

    }



    /*
     * UNDER 5000
     */

    else if (priceVal === 'UNDER_5000') {

        filtered =
            filtered.filter(
                product =>
                    Number(product.price || 0) <= 5000
            );

    }



    /*
     * 5000 - 12000
     */

    else if (priceVal === '5000_12000') {

        filtered =
            filtered.filter(
                product => {

                    const price =
                        Number(product.price || 0);

                    return (
                        price >= 5000 &&
                        price <= 12000
                    );

                }
            );

    }



    /*
     * ABOVE 12000
     */

    else if (priceVal === 'ABOVE_12000') {

        filtered =
            filtered.filter(
                product =>
                    Number(product.price || 0) > 12000
            );

    }



    /*
     * RENDER
     */

    renderProducts(filtered);

}



/* ==================================================
   5. RENDER PRODUCTS
================================================== */

function renderProducts(products) {

    const grid =
        document.getElementById('productsGrid');


    if (!grid) {

        console.error(
            'productsGrid not found in couple.html'
        );

        return;

    }



    /*
     * EMPTY STATE
     */

    if (products.length === 0) {

        grid.innerHTML = `

            <div class="empty-state">

                <i class="fa-solid fa-box-open"></i>

                <p class="empty-state-title">
                    Is category mein koi couple watch nahi mili.
                </p>

                <p class="empty-state-text">
                    Dusri category ya price filter check karein.
                </p>

            </div>

        `;


        return;

    }



    /*
     * PRODUCT CARDS
     */

    grid.innerHTML =
        products.map(product => {


            /*
             * PRODUCT IMAGE
             */

            const image =
                product.images &&
                product.images.length > 0

                    ? product.images[0]

                    : 'images/placeholder.jpg';



            /*
             * PRICE
             */

            const price =
                Number(
                    product.price || 0
                )
                .toLocaleString();



            /*
             * COUPLE CATEGORY
             *
             * IMPORTANT:
             * Read material from database.
             */

            const coupleType =
                product.material ||
                'Couple';



            /*
             * CARD
             */

            return `

                <div
                    onclick="goToDetail('${product._id}')"
                    class="product-card"
                >


                    <!-- IMAGE -->

                    <div class="product-image-container">


                        <img
                            src="${image}"
                            alt="${product.title || 'Couple Watch'}"
                            class="product-image"
                            loading="lazy"
                        >


                        <span class="product-badge">

                            ${coupleType}

                        </span>


                    </div>



                    <!-- BODY -->

                    <div class="product-body">


                        <div>

                            <h3 class="product-title">

                                ${product.title || 'Couple Watch'}

                            </h3>


                            <p class="product-description">

                                ${product.description || 'Couple Matching Watch Set'}

                            </p>

                        </div>



                        <div class="product-bottom">


                            <span class="product-price">

                                Rs. ${price}

                            </span>


                            <button
                                type="button"
                                class="details-btn"
                                onclick="event.stopPropagation(); goToDetail('${product._id}')"
                            >

                                <span>
                                    Details
                                </span>

                                <i class="fa-solid fa-chevron-right"></i>

                            </button>


                        </div>


                    </div>


                </div>

            `;

        }).join('');

}



/* ==================================================
   6. PRODUCT DETAIL PAGE
================================================== */

function goToDetail(productId) {

    window.location.href =
        `product-detail.html?id=${productId}`;

}



/* ==================================================
   7. INITIAL LOAD
================================================== */

document.addEventListener(
    'DOMContentLoaded',
    function () {

        fetchCoupleProducts();

    }
);

</script>


</body>
</html>
